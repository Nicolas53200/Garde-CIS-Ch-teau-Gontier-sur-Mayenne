  <script>
  // ---- SDK Serveur JSON (compatible Laval & CIS Château-Gontier) ----
  window.JSON_SERVER_URL = localStorage.getItem('chg_server_url') || || "https://api-garde-chg.fr";

  (function(){

    function stableHash(obj){
      try {
        return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      } catch(e) { return String(Math.random()); }
    }

    async function callApi(action, record) {
      const base = window.JSON_SERVER_URL;
      try {
        let url, method, body;
        if (action === 'list') {
          // Poll léger : sans images (rapide)
          url = base + '/api/records'; method = 'GET'; body = undefined;
        } else if (action === 'list_full') {
          // Chargement complet : avec images (initial ou changement de slide)
          url = base + '/api/records?with_images=1'; method = 'GET'; body = undefined;
        } else if (action === 'create') {
          url = base + '/api/records'; method = 'POST'; body = JSON.stringify(record);
        } else if (action === 'update') {
          const id = record.__backendId || record.id;
          url = base + '/api/records/' + id; method = 'PUT'; body = JSON.stringify(record);
        } else if (action === 'delete') {
          const id = record.__backendId || record.id;
          url = base + '/api/records/' + id; method = 'DELETE'; body = undefined;
        }
        const resp = await fetch(url, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body
        });
        if (!resp.ok) return { isOk: false, error: `HTTP ${resp.status}` };
        const data = await resp.json().catch(() => ({}));
        return { isOk: true, value: data };
      } catch(e) {
        return { isOk: false, error: e.message };
      }
    }

    function makeSdk(){
      let handler = null;
      let pollMs = 5000;
      let timer = null;
      let lastHash = null;
      let serverOnline = true;

      function setServerStatus(online) {
        if (online === serverOnline) return;
        serverOnline = online;
        window.serverOnline = online;
        if (handler && handler.onServerStatusChanged) {
          handler.onServerStatusChanged(online);
        }
      }

      async function tick(){
        if (!handler || !handler.onDataChanged) return;
        // Bloquer complètement le poll si une sauvegarde est en cours
        if (window._guardSaving) return;
        const r = await callApi('list');
        if (!r.isOk) {
          setServerStatus(false);
          return;
        }
        setServerStatus(true);
        // Re-vérifier après l'appel réseau (peut prendre du temps)
        if (window._guardSaving) return;
        const records = Array.isArray(r.value) ? r.value : [];
        const h = stableHash(records.map(x => [x.__backendId, x.id, x.updatedAt, x.createdAt]));
        if (h !== lastHash){
          lastHash = h;
          handler.onDataChanged(records);
        }
      }

      return {
        isServerOnline() { return serverOnline; },
        async init(h){
          handler = h;
          const first = await callApi('list_full');
          if (!first.isOk) {
            console.error('Serveur CG inaccessible :', first.error);
            setServerStatus(false);
            // Lancer quand même le polling pour détecter le retour du serveur
            if (timer) clearInterval(timer);
            timer = setInterval(() => { tick(); }, pollMs);
            return first;
          }
          setServerStatus(true);
          handler.onDataChanged(Array.isArray(first.value) ? first.value : []);
          if (timer) clearInterval(timer);
          timer = setInterval(() => { tick(); }, pollMs);
          return { isOk: true, value: true };
        },
        async create(record){
          const r = await callApi('create', record);
          if (r.isOk) {
            setServerStatus(true);
            const id = r.value?.id ?? r.value?.__backendId ?? record.id;
            return { isOk: true, value: { ...record, id, __backendId: id } };
          }
          setServerStatus(false);
          return r;
        },
        async update(record){
          const r = await callApi('update', record);
          if (r.isOk) setServerStatus(true); else setServerStatus(false);
          return r;
        },
        async delete(record){
          const r = await callApi('delete', record);
          if (r.isOk) setServerStatus(true); else setServerStatus(false);
          return r;
        }
      };
    }

    window.dataSdk = window.dataSdk || makeSdk();
  })();
  </script>

    window.selectWeekFromDay = function(year, month, day) {
      const selectedDate = new Date(year, month, day);
      selectedDate.setHours(12, 0, 0, 0);

      const currentMonday = mondayOfWeek(new Date());
      const selectedMonday = mondayOfWeek(selectedDate);

      const diffMs = selectedMonday.getTime() - currentMonday.getTime();
      const diffWeeks = Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));

      // Keep calendar view on the chosen month

        function mondayOfWeek(dateLike) {
      const d = new Date(dateLike);
      // Use midday to avoid DST edge cases
      d.setHours(12, 0, 0, 0);
      const day = d.getDay(); // 0=Sun..6=Sat
      const diff = (day === 0 ? -6 : 1 - day); // bring back to Monday
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getWeekKey(weekOffset = 0) {
      const weekStart = mondayOfWeek(new Date());
      weekStart.setDate(weekStart.getDate() + (weekOffset * 7));
      return isoLocalDate(weekStart);
    }

    function getWeekDates(weekOffset = 0) {
      const weekStart = mondayOfWeek(new Date());
      weekStart.setDate(weekStart.getDate() + (weekOffset * 7));
      weekStart.setHours(0, 0, 0, 0);

      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      weekEnd.setHours(0, 0, 0, 0);

      return {
        start: weekStart,
        end: weekEnd,
        key: isoLocalDate(weekStart)
      };
    }

    function formatWeekRange(weekOffset = 0) {
      const dates = getWeekDates(weekOffset);
      const options = { day: 'numeric', month: 'short' };
      const start = dates.start.toLocaleDateString('fr-FR', options);
      const end = dates.end.toLocaleDateString('fr-FR', options);
      const year = dates.start.getFullYear();
      return `${start} - ${end} ${year}`;

    function upsertRecordByBackendId(list, record) {
      const bid = record && record.__backendId != null ? String(record.__backendId) : null;
      if (!bid) return [...list, record];
      const idx = list.findIndex(r => r && r.__backendId != null && String(r.__backendId) === bid);
      if (idx === -1) return [...list, record];
      const copy = list.slice();
      copy[idx] = record;
      return copy;
    }

    function dedupeRecordsByBackendId(list) {
      const seen = new Set();
      const out = [];
      for (const r of list) {
        const bid = r && r.__backendId != null ? String(r.__backendId) : null;
        if (bid) {
          if (seen.has(bid)) continue;
          seen.add(bid);
        }
        out.push(r);
      }
      return out;
    }

function normalizeWeekKey(v) {
  if (v == null || v === '') return null;

  // Si c'est déjà du type "YYYY-MM-DD" => ok
  if (typeof v === 'string') {
    const s = v.trim();

    // ✅ Cas critique : ISO avec heure / timezone (ex: "2026-02-01T23:00:00.000Z")
    // On parse en Date puis on repasse en date locale pour éviter de tomber sur la veille.
    if (/[Tt]/.test(s) || /Z$/.test(s) || /[\+\-]\d{2}:?\d{2}$/.test(s)) {
      const dIso = new Date(s);
      if (!isNaN(dIso.getTime())) return isoLocalDate(dIso);
    }

    const iso = s.match(/^(\d{4}-\d{2}-\d{2})/);
    if (iso) return iso[1];

    // ✅ Cas FR "dd/mm/yyyy"
    const fr = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (fr) {
      const dd = Number(fr[1]);
      const mm = Number(fr[2]);
      const yyyy = Number(fr[3]);
      const d = new Date(yyyy, mm - 1, dd);
      return isoLocalDate(d);
    }

    // Autres formats lisibles (ex: "Tue Feb 03 2026...")
    const d = new Date(s);
    if (!isNaN(d.getTime())) return isoLocalDate(d);

    return s;
  }

  if (v instanceof Date) return isoLocalDate(v);

  return String(v);
}

function isoLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function normStr(v){ return (v==null ? '' : String(v)).trim().toLowerCase(); }

function sameBackendId(a,b){

/* ✅ COLLE ICI */
function weekKeyToMonday(v) {
  const s = normalizeWeekKey(v);
  if (!s) return null;

  // On parse à midi pour éviter les décalages de fuseau horaire
  const d = new Date(s + "T12:00:00");
  if (isNaN(d.getTime())) return s;

  const day = d.getDay(); // 0=dimanche, 1=lundi, ...
  const diff = (day === 0 ? -6 : 1 - day); // ramène au lundi
  d.setDate(d.getDate() + diff);

  return isoLocalDate(d);
}

}

// ISO week number (1..53), based on ISO-8601 (week starts Monday)
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  // Thursday in current week decides the year.
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return weekNo;
}

function getRecordDayOfWeek(record) {
  const v = (record && (record.dayOfWeek ?? record.day_of_week ?? record.jour ?? record.dow));
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function getRecordWeekKey(record) {
  const v = (record && (record.weekKey ?? record.week_key ?? record.semaine ?? record.week));
  return weekKeyToMonday(v);
}

        // Pour les notes et autres données

            if (!dateDebut) return;

              // Seulement date de début : afficher à partir de cette date
              isInRange = selectedDate >= dateDebut;
            }

            if (!isInRange) return;

            const item = {
              id: record.id,
              __backendId: record.__backendId,
              texte: record.notes,
              vehicule: record.vehicule || '',
              contact: record.contact || '',
              dateDebut: record.creneau || '',
              dateFin: record.grade || ''
            };

            if (record.zone === 'voiesBarrees') {
              window.voiesBarreesList.push(item);

    function dedupeListById(list) {
      const seen = new Set();
      const out = [];
      for (const it of (list || [])) {
        const key = it && (it.__backendId != null ? String(it.__backendId) : (it.id != null ? String(it.id) : JSON.stringify(it)));
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(it);
      }
      return out;
    }


    // ===== SPÉCIALITÉS (SAV / USAR / FDF / DRONE / RCH / MEA) =====

    const SPECIALITES_LIST = [
      { id: 'SAV1', label: 'SAV 1', base: 'SAV', emoji: '🤿', level: '✶' },
      { id: 'SAV2', label: 'SAV 2', base: 'SAV', emoji: '🤿', level: '✶✶' },
      { id: 'USAR1', label: 'USAR 1', base: 'USAR', emoji: '⛏️', level: '✶' },
      { id: 'USAR2', label: 'USAR 2', base: 'USAR', emoji: '⛏️', level: '✶✶' },
      { id: 'FDF1', label: 'FDF 1', base: 'FDF', emoji: '🔥', level: '✶' },
      { id: 'FDF2', label: 'FDF 2', base: 'FDF', emoji: '🔥', level: '✶✶' },
      { id: 'DRONE', label: 'Pilote drone', base: 'DRONE', emoji: '🚁', level: '' },
      { id: 'RCH', label: 'RCH', base: 'RCH', emoji: '☣️', level: '' },
      { id: 'MEA', label: 'MEA', base: 'MEA', emoji: '🚒', level: '' }
    ];

    function parseSpecialites(value) {
      if (!value) return [];
      let arr = [];

      if (Array.isArray(value)) {
        arr = value;
      } else if (typeof value === 'string') {
        const trimmed = value.trim();
        if (!trimmed) return [];
        try {
          const parsed = JSON.parse(trimmed);
          if (Array.isArray(parsed)) arr = parsed;
          else if (parsed && Array.isArray(parsed.specialites)) arr = parsed.specialites;
          else arr = trimmed.split(',');
        } catch (e) {
          arr = trimmed.split(',');
        }
      } else if (typeof value === 'object' && Array.isArray(value.specialites)) {
        arr = value.specialites;
      }

      return [...new Set(arr.map(v => normalizeSpecialite(v)).filter(Boolean))];
    }

    function normalizeSpecialite(value) {
      const raw = (value || '').toString().trim().toUpperCase()
        .replace(/\s+/g, '')
        .replace('-', '');

      if (!raw) return '';
      if (raw === 'CONDUCTEURMEA' || raw === 'CMEA') return 'MEA';

      // Compatibilité anciennes valeurs : sans niveau = niveau 1
      if (raw === 'SAV') return 'SAV1';
      if (raw === 'USAR') return 'USAR1';
      if (raw === 'FDF') return 'FDF1';

      if (raw === 'SAV1' || raw === 'SAV2') return raw;
      if (raw === 'USAR1' || raw === 'USAR2') return raw;
      if (raw === 'FDF1' || raw === 'FDF2') return raw;
      if (raw === 'DRONE' || raw === 'PILOTEDRONE' || raw === 'PILOTEDRÔNE') return 'DRONE';
      if (raw === 'RCH' || raw === 'MEA') return raw;

      return raw;
    }

    function getSpecialiteDef(id) {
      const norm = normalizeSpecialite(id);
      return SPECIALITES_LIST.find(s => s.id === norm) || { id: norm, label: norm, base: norm, emoji: '⭐', level: '' };
    }

    function getPersonSpecialites(personOrName, personType = null) {
      if (personOrName && typeof personOrName === 'object' && Array.isArray(personOrName.specialites)) {
        return parseSpecialites(personOrName.specialites);
      }
      const name = typeof personOrName === 'string' ? personOrName : (personOrName && personOrName.nom) || (personOrName && personOrName.name) || '';
      const grade = personOrName && typeof personOrName === 'object' ? (personOrName.grade || '') : '';
      const found = availablePersonnel.find(p =>
        sameName(p.name, name) &&
        (!personType || p.type === personType || !p.type) &&
        (!grade || p.grade === grade)
      ) || availablePersonnel.find(p => sameName(p.name, name));
      return found ? parseSpecialites(found.specialites) : [];
    }

    function renderSpecialitesBadges(specialites, scale = 1) {
      const badges = parseSpecialites(specialites);
      if (!badges.length) return '';

      return `<span style="display:inline-flex; gap:${3 * scale}px; flex-wrap:wrap; margin-left:${5 * scale}px; vertical-align:middle; align-items:center;">${badges.map(tag => {
        const def = getSpecialiteDef(tag);
        const iconSize = Math.max(12, config.font_size * 0.36 * scale);
        return `<span class="spec-badge" title="${def.label}">
          <span style="font-size:${iconSize}px; line-height:1; filter: drop-shadow(0 0 2px rgba(255,255,255,0.25));">${def.emoji}</span>
          ${def.level ? `<span class="spec-level">${def.level}</span>` : ''}
        </span>`;
      }).join('')}</span>`;
    }

    function renderSpecialitesText(personOrName) {
      const tags = getPersonSpecialites(personOrName);
      return tags.length ? ` [${tags.map(t => getSpecialiteDef(t).label).join('] [')}]` : '';
    }

    window.saveSpecialites = async function(name, personType) {
      const modal = document.getElementById('specialites-modal');
      const selected = modal
        ? Array.from(modal.querySelectorAll('.specialite-option'))
            .filter(btn => btn.getAttribute('data-checked') === '1')
            .map(btn => btn.dataset.spec)
        : [];

      const idx = availablePersonnel.findIndex(p => p && p.name === name && p.type === personType);
      if (idx !== -1) {
        availablePersonnel[idx].specialites = selected;
      }

      const existingRecord = currentRecords.find(r =>
        r && r.type === 'personnel' && sameName(r.nom, name)
      );

      if (existingRecord) {
        existingRecord.notes = JSON.stringify({ specialites: selected });
        await updateData(existingRecord);
      } else {
        const p = availablePersonnel[idx];
        await saveData('personnel', {
          nom: name,
          grade: p ? p.grade : '',
          equipe: p ? p.equipe : null,
          personType: personType,
          zone: personType,
          notes: JSON.stringify({ specialites: selected })
        });
      }

      closeSpecialitesModal();
      render();
    };

    window.removeVerification = async function(vehiculeId, nom) {
  const wk = weekKeyToMonday(getWeekKey(currentWeekOffset));
  const dow = Number(selectedDayOfWeek);

  const candidates = currentRecords.filter(r =>
    r && r.type === 'verification' &&
    r.zone === vehiculeId &&
    sameName(r.nom, nom) &&
    Number(r.dayOfWeek) === dow &&
    weekKeyToMonday(r.weekKey) === wk
  );

  if (!candidates.length) {
    showSavingIndicator('✗ Vérification introuvable', true);
    return;
  }

  const record = candidates.slice().reverse().find(r => r.__backendId != null) || candidates[candidates.length - 1];
  await deleteData(record);
};

    function setupVerificationsDragAndDrop() {
      document.querySelectorAll('.drop-zone').forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.style.background = config.primary_action_color + '30';
        });

        zone.addEventListener('dragleave', (e) => {
          zone.style.background = config.surface_color;
        });

        zone.addEventListener('drop', async (e) => {
  e.preventDefault();
  zone.style.background = config.surface_color;

  const name = (e.dataTransfer.getData('name') || '').trim();
  const grade = e.dataTransfer.getData('grade') || '';
  const vehiculeId = zone.dataset.zone;

  if (!name) return;

  if (!vehiculeAssignments[vehiculeId]) vehiculeAssignments[vehiculeId] = [];
  if (vehiculeAssignments[vehiculeId].length >= 2) return;
  if (vehiculeAssignments[vehiculeId].includes(name)) return;

  // Mise à jour locale immédiate
  vehiculeAssignments[vehiculeId].push(name);
  render();
  window._guardSaving = true;
  await saveData('verification', { nom: name, grade, zone: vehiculeId }, { skipRender: true });
  setTimeout(() => { window._guardSaving = false; }, 4000);
});
        });

      inp.oninput = function() { window.o2UpdateBtn(); };

      var hint = document.createElement('p');

      btnSend.onclick = function() { window.sendO2Mail(); };

      var btnClose = document.createElement('button');
      btnClose.setAttribute('style', 'background:#334155;color:#cbd5e1;border:none;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;font-weight:700;');
      btnClose.textContent = 'X';
      btnClose.onclick = function() { overlay.remove(); };

      row.appendChild(btnSend);

      box.appendChild(title);
      box.appendChild(desc);
      box.appendChild(lbl);
      box.appendChild(inp);
      box.appendChild(hint);
      box.appendChild(row);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      setTimeout(function() { inp.focus(); }, 50);
    };

    window.o2UpdateBtn = function() {
      var qtyEl = document.getElementById('o2-qty-input');
      var qty = qtyEl ? (parseInt(qtyEl.value) || 0) : 0;
      var hint = document.getElementById('o2-msg-hint');
      var btn  = document.getElementById('o2-send-btn');
      if (!hint || !btn) return;
      if (qty === 0) {
        hint.style.color = '#94a3b8';
        hint.textContent = 'Stock suffisant — un mail de confirmation sera envoyé';
        btn.style.background = '#475569';
        btn.style.color = '#f8fafc';
        btn.textContent = 'Envoyer la confirmation';
      } else {
        hint.style.color = '#22c55e';
        hint.textContent = qty + (qty > 1 ? ' bouteilles demandées' : ' bouteille demandée');
        btn.style.background = '#38bdf8';
        btn.style.color = '#0f172a';
        btn.textContent = 'Envoyer la commande';
      }
    };

        window.sendO2Mail = function() {
      var qty = parseInt(document.getElementById('o2-qty-input') ? document.getElementById('o2-qty-input').value : '1');
      if (isNaN(qty) || qty < 0) qty = 0;
      var today = new Date();
      var dateStr = today.toLocaleDateString('fr-FR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
      var cfg = window.o2MailConfig || {};
      var destMail = cfg.email || 'pharmacie.departementale@sdis53.fr';
      var subjectText = qty === 0
        ? 'Stock O\u00b2 suffisant - CIS Château-Gontier-sur-Mayenne'
        : (cfg.subject || 'Commande O\u00b2 - CIS Château-Gontier-sur-Mayenne');
      var signature = cfg.signature || 'Le chef de garde\nCIS Château-Gontier-sur-Mayenne';
      var subject = encodeURIComponent(subjectText);
      var nl = '\n';
      var bodyLines;
      if (qty === 0) {
        bodyLines = [
          'Bonjour,',
          '',
          'Suite à la vérification du stock d’oxygène effectuée ce ' + dateStr + ',',
          'nous vous informons que le stock de bouteilles d’oxygène est suffisant.',
          '',
          'Aucune commande n’est nécessaire à ce jour.',
          '',
          'Cordialement,',
          signature
        ];
      } else {
        bodyLines = [
          'Bonjour,',
          '',
          'Suite à la vérification du stock d’oxygène effectuée ce ' + dateStr + ',',
          'nous sollicitons une commande de bouteilles d’oxygène.',
          '',
          'Nombre de bouteilles à commander : ' + qty,
          '',
          'Merci de bien vouloir prendre en compte cette demande dans les meilleurs délais.',
          '',
          'Cordialement,',
          signature
        ];
      }
      var body = encodeURIComponent(bodyLines.join(nl));
      window.location.href = 'mailto:' + destMail + '?subject=' + subject + '&body=' + body;
      document.getElementById('o2-mail-modal').remove();
    };;

    function renderGliSlide() {
      const fontSize = config.font_size;

      // Couleurs par engin pour le calendrier
      const enginColors = {
        'VLU':'#378ADD','VTU':'#1D9E75','VLHR':'#D4537E','VTP':'#BA7517',
        'VLI':'#534AB7','FPT55':'#D85A30','FPT53':'#639922','MEA':'#993556',
        'CCFM':'#0F6E56','VSR':'#5F5E5A'
      };
      const defaultColor = '#888780';

      // Construire les données agenda depuis allEnginsIndispoList (toutes périodes)
      const agendaItems = (window.allEnginsIndispoList || window.enginsIndispoList || []).map(item => {
        const vehicule = item.vehicule || item.texte?.split(' — ')[0] || item.texte || '';
        const color = enginColors[vehicule] || defaultColor;
        return { ...item, vehicule, color };
      });

      // Générer le calendrier du mois courant
      function renderCalendrierMois(offsetMois) {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth() + offsetMois;
        const moisDate = new Date(y, m, 1);
        const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        const moisLabel = moisNoms[((m % 12) + 12) % 12] + ' ' + moisDate.getFullYear();
        const daysInMonth = new Date(moisDate.getFullYear(), moisDate.getMonth() + 1, 0).getDate();
        let startDow = moisDate.getDay(); // 0=dim
        startDow = startDow === 0 ? 6 : startDow - 1; // lundi = 0
        const today = new Date(); today.setHours(0,0,0,0);
        const jourNoms = ['L','M','M','J','V','S','D'];

        const cellSize = Math.max(22, Math.floor(fontSize * 0.45));
        const textSize = Math.max(10, Math.floor(fontSize * 0.35));

        let html = `
          <div style="background:${config.surface_color};border-radius:10px;padding:10px;flex:1;min-width:0;">
            <p style="font-size:${fontSize*0.45}px;color:${config.secondary_action_color};font-weight:700;text-align:center;margin:0 0 8px 0;">${moisLabel}</p>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;">
              ${jourNoms.map(j=>`<div style="text-align:center;font-size:${textSize}px;color:${config.text_color}50;font-weight:600;">${j}</div>`).join('')}
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">`;

        for (let i = 0; i < startDow; i++) {
          html += `<div style="height:${cellSize}px;"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(moisDate.getFullYear(), moisDate.getMonth(), day);
          date.setHours(0,0,0,0);
          const isToday = date.getTime() === today.getTime();

          // Trouver les engins indispos ce jour
          const evs = agendaItems.filter(item => {
            if (!item.dateDebut) return false;
            const debut = new Date(item.dateDebut); debut.setHours(0,0,0,0);
            const fin = item.dateFin ? new Date(item.dateFin) : new Date('2099-12-31'); fin.setHours(0,0,0,0);
            return date >= debut && date <= fin;
          });

          const hasPb = evs.length > 0;
          const bgColor = hasPb
            ? (evs.length === 1 ? evs[0].color + '55' : config.primary_action_color + '40')
            : (isToday ? config.secondary_action_color + '30' : config.background_color);
          const border = isToday
            ? `2px solid ${config.secondary_action_color}`
            : hasPb ? `1px solid ${evs[0].color}80` : `1px solid ${config.text_color}15`;

          // Tooltip (liste des engins)
          const tooltipLines = evs.map(e => {
            const fmt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '?';
            return `<div style="margin-bottom:2px;"><b style="color:${e.color}">${e.vehicule}</b> ${e.texte?.includes(' — ') ? '— ' + e.texte.split(' — ').slice(1).join(' — ') : ''}<br><span style="opacity:0.7;">${fmt(e.dateDebut)}${e.dateFin?' → '+fmt(e.dateFin):''}</span>${e.contact?`<br><span style="color:${config.secondary_action_color}">📞 ${e.contact}</span>`:''}</div>`;
          }).join('');

          // Petites pastilles colorées (max 3)
          const pastilles = evs.slice(0,3).map(e =>
            `<div style="width:5px;height:5px;border-radius:50%;background:${e.color};flex-shrink:0;"></div>`
          ).join('');

          html += `
            <div style="height:${cellSize}px;border-radius:4px;background:${bgColor};border:${border};
                        display:flex;flex-direction:column;align-items:center;justify-content:center;
                        position:relative;cursor:${hasPb?'pointer':'default'};"
                 ${hasPb ? `onmouseenter="showEnginTooltip(this, event)" onmouseleave="hideEnginTooltip(this)"` : ''}>
              <span style="font-size:${textSize}px;color:${isToday?config.secondary_action_color:config.text_color};font-weight:${isToday?'700':'400'};">${day}</span>
              ${pastilles ? `<div style="display:flex;gap:1px;margin-top:1px;">${pastilles}</div>` : ''}
              ${hasPb ? `<div class="engin-tooltip" style="display:none;position:fixed;
                          background:${config.surface_color};border:1px solid ${config.secondary_action_color}80;border-radius:10px;
                          padding:10px 14px;font-size:${Math.max(11, textSize+1)}px;color:${config.text_color};
                          white-space:normal;word-break:break-word;z-index:9999;
                          box-shadow:0 6px 24px rgba(0,0,0,0.6);min-width:200px;max-width:320px;text-align:left;
                          pointer-events:none;">${tooltipLines}</div>` : ''}
            </div>`;
        }
        html += `</div></div>`;
        return html;
      }

      // Légende des couleurs
      const enginColors2 = enginColors;
      const legendHtml = Object.entries(enginColors2).map(([nom, color]) =>
        `<div style="display:flex;align-items:center;gap:4px;">
          <div style="width:10px;height:10px;border-radius:2px;background:${color};flex-shrink:0;"></div>

          <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;">

            <div style="display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;">

              <!-- Liste engins -->
              <div class="rounded-xl p-3" style="background:${config.surface_color};border-left:4px solid ${config.primary_action_color};flex-shrink:0;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                  <h3 class="font-display tracking-wider" style="font-size:${fontSize*0.65}px;color:${config.secondary_action_color};">🚒 ENGINS INDISPONIBLES / RÉSERVÉS</h3>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px;max-height:140px;overflow-y:auto;">
                  ${(window.enginsIndispoList || []).map(item => `

    // Tooltip global : on le détache du parent et on l'accroche au body pour éviter

    let _globalTip = null;
    let _globalTipSource = null;

    window.showEnginTooltip = function(el, event) {
      const tip = el.querySelector('.engin-tooltip');
      if (!tip) return;

      // Cacher l'éventuel tooltip précédent
      if (_globalTip && _globalTip !== tip) {
        _globalTip.style.display = 'none';
        if (_globalTip.parentNode === document.body) {
          document.body.removeChild(_globalTip);
          _globalTipSource && _globalTipSource.appendChild(_globalTip);
        }
      }

      // Déplacer le tooltip dans le body s'il n'y est pas déjà
      if (tip.parentNode !== document.body) {
        _globalTipSource = tip.parentNode;
        document.body.appendChild(tip);
      }
      _globalTip = tip;
      _globalTipSource = _globalTipSource || el;

      // Afficher hors écran pour mesurer
      tip.style.position = 'fixed';
      tip.style.left = '-9999px';
      tip.style.top = '-9999px';
      tip.style.display = 'block';

      const e = event || window._lastMouseEvent || { clientX: 200, clientY: 200 };
      requestAnimationFrame(() => {
        const margin = 14;
        const tipW = tip.offsetWidth || 240;
        const tipH = tip.offsetHeight || 80;
        let x = e.clientX + margin;
        let y = e.clientY - tipH / 2;
        if (x + tipW > window.innerWidth - 10) x = e.clientX - tipW - margin;
        if (y + tipH > window.innerHeight - 10) y = window.innerHeight - tipH - 10;
        if (y < 10) y = 10;
        tip.style.left = x + 'px';
        tip.style.top = y + 'px';
      });
    };

    window.hideEnginTooltip = function(el) {
      if (_globalTip) {
        _globalTip.style.display = 'none';
      }
      // Aussi cacher le tip local au cas où
      const tip = el.querySelector('.engin-tooltip');
      if (tip) tip.style.display = 'none';

      const slides = document.querySelectorAll('.carousel-slide');

      if (!slides.length) return;
      let current = 0;
      let timer = null;

      function goTo(idx) {
        slides[current].style.opacity = '0';
        slides[current].style.pointerEvents = 'none';
        dots[current] && (dots[current].style.background = config.text_color + '30');
        current = (idx + slides.length) % slides.length;
        slides[current].style.opacity = '1';
        slides[current].style.pointerEvents = 'auto';
        dots[current] && (dots[current].style.background = config.secondary_action_color);
      }

      function startTimer() {
        if (timer) clearInterval(timer);
        if (slides.length > 1) timer = setInterval(() => goTo(current + 1), 80);
      }

      dots.forEach(d => d.addEventListener('click', () => { goTo(parseInt(d.dataset.idx)); startTimer(); }));
      startTimer();
      window._carouselTimer = timer;

    function playDepartureAlertSound() {
      if (!departureAlertSoundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const now = ctx.currentTime;
        [0, 0.25, 0.5].forEach(function(offset, index) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = index % 2 === 0 ? 'square' : 'sine';
          osc.frequency.setValueAtTime(index % 2 === 0 ? 880 : 660, now + offset);
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.12, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + offset); osc.stop(now + offset + 0.2);
        });
        setTimeout(function() { try { ctx.close(); } catch(_) {} }, 1200);
      } catch(e) {}
    }

      const isNewAlert = newSignature !== lastDepartureAlertSignature;
      activeDepartureAlert = normalizedAlert;

        const serverAlert = (payload && payload.active) || (payload && payload.alert) || (payload && payload.data) || payload;

        if (serverAlert && (serverAlert.address || serverAlert.adresse || serverAlert.latitude || serverAlert.lat || serverAlert.type || serverAlert.nature)) {

    window.goToSlide = function(index) {
      currentSlide = index;
      progressValue = 0;
      if (isAutoPlaying) {
        restartAutoPlay();
      }
      render();
    };

    window.nextSlide = function() {
      currentSlide = (currentSlide + 1) % slides.length;
      progressValue = 0;
      if (isAutoPlaying) {
        restartAutoPlay();
      }
      render();
    };

    window.previousSlide = function() {
      currentSlide = (currentSlide - 1 + slides.length) % slides.length;
      progressValue = 0;
      if (isAutoPlaying) {
        restartAutoPlay();
      }
      render();
    };

    window.toggleAutoPlay = function() {
      isAutoPlaying = !isAutoPlaying;
      if (isAutoPlaying) {
        startAutoPlay();
      } else {
        stopAutoPlay();
      }
      render();
    };

    function startAutoPlay() {
      progressValue = 0;
      progressStartTime = Date.now();

      autoPlayInterval = setInterval(() => {
        nextSlide();
      }, SLIDE_DURATION);

      updateProgress();
    }

    function updateProgress() {
      if (!isAutoPlaying) return;

      const elapsed = Date.now() - progressStartTime;
      progressValue = Math.min(elapsed, SLIDE_DURATION);

      const progressBar = document.getElementById('progress-bar');
      if (progressBar) {
        progressBar.style.width = `${(progressValue / SLIDE_DURATION) * 100}%`;
      }

      if (progressValue < SLIDE_DURATION) {
        progressAnimationFrame = requestAnimationFrame(updateProgress);
      }
    }

    function stopAutoPlay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
      }
      if (progressAnimationFrame) {
        cancelAnimationFrame(progressAnimationFrame);
        progressAnimationFrame = null;
      }
      progressValue = 0;
    }

    function restartAutoPlay() {
      stopAutoPlay();
      startAutoPlay();
    }

    const dataHandler = {
      onDataChanged(rawData) {
        // Si une sauvegarde de garde est en cours, mettre à jour silencieusement
        if (window._guardSaving) {
          const data = (rawData || []).map(r => ({
            ...r,
            __backendId: r.__backendId != null ? r.__backendId : r.id
          }));
          currentRecords = data;
          return;
        }
        // Préserver les images déjà chargées : si le poll renvoie un record
        // avec __IMG__ (référence fichier) mais qu'on a déjà la vraie image en mémoire, on la conserve
        const prevById = {};
        (currentRecords || []).forEach(r => { prevById[r.id || r.__backendId] = r; });

        const data = (rawData || []).map(r => {
          const mapped = { ...r, __backendId: r.__backendId != null ? r.__backendId : r.id };
          const prev = prevById[mapped.id] || prevById[mapped.__backendId];

          // Si le poll renvoie __IMG__ mais qu'on a déjà la vraie image → conserver
          if (prev && mapped.notes && mapped.notes.includes('__IMG__') && prev.notes && !prev.notes.includes('__IMG__')) {
            return { ...mapped, notes: prev.notes };
          }
          return mapped;
        });
        currentRecords = data;
        loadDataFromRecords(data);
        if (isInitialized) {
          render();
        }
      },
      onServerStatusChanged(online) {
        const banner = document.getElementById('server-offline-banner');
        if (banner) {
          if (online) {
            banner.classList.remove('visible');
          } else {
            banner.classList.add('visible');
          }
        }
        // Mettre à jour l'état visuel des zones de drop
        applyOfflineUI(!online);
        if (online && isInitialized) {
          showSavingIndicator('✓ Serveur reconnecté');
        }
      }
    };

    function applyOfflineUI(isOffline) {
      // Cartes draggables
      document.querySelectorAll('.personnel-card').forEach(el => {
        if (isOffline) el.classList.add('drag-disabled');
        else el.classList.remove('drag-disabled');
      });
      // Zones de drop
      document.querySelectorAll('.drop-zone-garde, .drop-zone').forEach(el => {
        if (isOffline) el.classList.add('offline-drop-zone');
        else el.classList.remove('offline-drop-zone');
      });
    }

    async function onConfigChange(newConfig) {
      Object.assign(config, newConfig);
      if (isInitialized) {
        render();
      }
    }

    async function init() {
      if (window.dataSdk) {
        const result = await window.dataSdk.init(dataHandler);
        if (!result.isOk) {
          console.error('Failed to initialize data SDK:', result.error);
          // Afficher la bannière offline immédiatement
          const banner = document.getElementById('server-offline-banner');
          if (banner) banner.classList.add('visible');
          window.serverOnline = false;
        }
      }

      if (window.elementSdk) {
        await window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: (config) => ({
            recolorables: [
              { get: () => config.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },

              { get: () => config.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
              { get: () => config.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } },
              { get: () => config.secondary_action_color, set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); } }
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: { get: () => config.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
          }),
          mapToEditPanelValues: (config) => new Map([
            ['centre_name', config.centre_name]
          ])
        });

      }

      render();
      startClock();
    }

    // ═══════════════════════════════════════════════════
    // PANNEAU ADMINISTRATION — CIS CHÂTEAU-GONTIER
    // ═══════════════════════════════════════════════════

    // ── Système d'authentification multi-utilisateurs ──────────────────────────
    // Compte administrateur général (code maître)
    const SUPER_ADMIN_CODE = 'CISCHATEAU53';

    // Utilisateurs stockés en mémoire (chargés depuis le serveur)
    let adminUsers = []; // { nom, code, createdAt, createdBy }
    let adminAuthenticated = false;
    let adminTab = 'personnel';
    let currentAdminUser = null; // { nom, code, isSuperAdmin }

    // ── Journal d'audit ──────────────────────────────────────────────────────
    let auditLog = []; // { qui, action, detail, quand }

    function auditEntry(action, detail) {
      if (!currentAdminUser) return;
      const entry = {
        qui: currentAdminUser.nom,
        action,
        detail: detail || '',
        quand: new Date().toISOString()
      };
      auditLog.unshift(entry);
      if (auditLog.length > 500) auditLog = auditLog.slice(0, 500);
      // Sauvegarder le journal sur le serveur
      saveAuditLog();
    }

    async function saveAuditLog() {
      try {
        const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'auditLog');
        const data = JSON.stringify(auditLog.slice(0, 200));
        if (existing) {
          existing.notes = data;
          await window.dataSdk?.update(existing);
        } else {
          const result = await window.dataSdk?.create({
            id: 'auditLog_' + Date.now(),
            type: 'config', zone: 'auditLog',
            notes: data,
            dayOfWeek: 0, weekKey: 'global', week_key: 'global', day_of_week: 0,
            createdAt: new Date().toISOString()
          });
          if (result?.isOk && result.value) {
            currentRecords = upsertRecordByBackendId(currentRecords, result.value);
          }
        }
      } catch(e) { console.warn('Audit save error:', e); }
    }

    async function saveAdminUsers() {
      try {
        const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'adminUsers');
        const data = JSON.stringify(adminUsers);
        if (existing) {
          existing.notes = data;
          await window.dataSdk?.update(existing);
        } else {
          const result = await window.dataSdk?.create({
            id: 'adminUsers_' + Date.now(),
            type: 'config', zone: 'adminUsers',
            notes: data,
            dayOfWeek: 0, weekKey: 'global', week_key: 'global', day_of_week: 0,
            createdAt: new Date().toISOString()
          });
          if (result?.isOk && result.value) {
            currentRecords = upsertRecordByBackendId(currentRecords, result.value);
          }
        }
      } catch(e) { console.warn('AdminUsers save error:', e); }
    }

    function loadAdminUsersFromRecords(records) {
      const r = records.find(r => r && r.type === 'config' && r.zone === 'adminUsers');
      if (r?.notes) { try { adminUsers = JSON.parse(r.notes) || []; } catch(e) {} }
      const a = records.find(r => r && r.type === 'config' && r.zone === 'auditLog');
      if (a?.notes) { try { auditLog = JSON.parse(a.notes) || []; } catch(e) {} }
    }

    window.openAdmin = function() {
      if (adminAuthenticated) { showAdminPanel(); }
      else { showAdminLogin(); }
    };

    window.closeAdmin = function() {
      const modal = document.getElementById('admin-modal');
      if (modal) modal.remove();
    };

    function showAdminLogin() {
      const old = document.getElementById('admin-modal');
      if (old) old.remove();
      const modal = document.createElement('div');
      modal.id = 'admin-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);';
      modal.innerHTML = `
        <div style="background:#16213e;border-radius:16px;padding:32px;min-width:340px;max-width:400px;border:2px solid #f59e0b40;box-shadow:0 20px 60px rgba(0,0,0,0.6);">
          <h2 style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;margin:0 0 4px 0;letter-spacing:1px;">⚙️ Administration</h2>
          <p style="font-size:13px;color:#f59e0b;margin:0 0 20px 0;">CIS Château-Gontier — accès protégé</p>
          <label style="display:block;font-size:11px;font-weight:700;color:#f59e0b;margin-bottom:6px;text-transform:uppercase;">Votre identifiant (prénom.nom)</label>
          <input id="admin-user-input" type="text" placeholder="Ex: jean.dupont" autocomplete="off"
                 onkeydown="if(event.key==='Enter') document.getElementById('admin-pwd-input').focus()"
                 style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:#1a1a2e;color:#fff;border:2px solid #f59e0b40;font-size:15px;margin-bottom:12px;outline:none;">
          <label style="display:block;font-size:11px;font-weight:700;color:#f59e0b;margin-bottom:6px;text-transform:uppercase;">Code d'accès</label>
          <input id="admin-pwd-input" type="password" placeholder="Code personnel"
                 onkeydown="if(event.key==='Enter') checkAdminPassword()"
                 style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:#1a1a2e;color:#fff;border:2px solid #f59e0b40;font-size:15px;margin-bottom:16px;outline:none;">
          <p id="admin-pwd-error" style="color:#ef4444;font-size:13px;margin:0 0 12px 0;display:none;">Identifiant ou code incorrect</p>
          <div style="display:flex;gap:10px;">
            <button onclick="closeAdmin()" style="flex:1;padding:10px;border-radius:10px;background:#1a1a2e;color:#fff;font-size:14px;font-weight:600;border:2px solid #ffffff20;cursor:pointer;">Annuler</button>
            <button onclick="checkAdminPassword()" style="flex:1;padding:10px;border-radius:10px;background:#f59e0b;color:#1a1a2e;font-size:14px;font-weight:700;border:none;cursor:pointer;">Connexion</button>
          </div>
        </div>`;
      modal.addEventListener('click', e => { if (e.target === modal) closeAdmin(); });
      document.body.appendChild(modal);
      setTimeout(() => document.getElementById('admin-user-input')?.focus(), 100);
    }

    window.checkAdminPassword = function() {
      const userVal = (document.getElementById('admin-user-input')?.value || '').trim().toLowerCase();
      const codeVal = (document.getElementById('admin-pwd-input')?.value || '').trim();

      // Vérifier super admin
      if (codeVal === SUPER_ADMIN_CODE) {
        adminAuthenticated = true;
        currentAdminUser = { nom: userVal || 'Admin Général', code: SUPER_ADMIN_CODE, isSuperAdmin: true };
        auditEntry('CONNEXION', 'Connexion administrateur général');
        showAdminPanel();
        return;
      }

      // Vérifier utilisateurs nommés
      const user = adminUsers.find(u => u.code === codeVal);
      if (user) {
        adminAuthenticated = true;
        currentAdminUser = { nom: user.nom, code: user.code, isSuperAdmin: false };
        auditEntry('CONNEXION', 'Connexion utilisateur : ' + user.nom);
        showAdminPanel();
        return;
      }

      // Echec
      const err = document.getElementById('admin-pwd-error');
      if (err) err.style.display = 'block';
      const inp = document.getElementById('admin-pwd-input');
      if (inp) { inp.value = ''; inp.focus(); }
      // Log tentative échouée
      const userTry = document.getElementById('admin-user-input')?.value || '?';
      console.warn('Tentative de connexion échouée pour:', userTry);
    };

    function showAdminPanel() {
      const old = document.getElementById('admin-modal');
      if (old) old.remove();
      const modal = document.createElement('div');
      modal.id = 'admin-modal';

      modal.innerHTML = `
        <div style="background:#16213e;border-radius:16px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;border:2px solid #f59e0b40;box-shadow:0 20px 60px rgba(0,0,0,0.6);">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0;">
            <div><h2 style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;margin:0;letter-spacing:1px;">⚙️ Administration — CIS Château-Gontier</h2><p style="margin:2px 0 0;font-size:12px;color:#f59e0b;">👤 Connecté : <b>${currentAdminUser?.nom || ''}</b>${currentAdminUser?.isSuperAdmin ? ' <span style="color:#22c55e;font-size:11px;">★ Admin Général</span>' : ''}</p></div>
            <div style="display:flex;gap:8px;align-items:center;">
              <button onclick="adminShowChangeCode()" style="padding:6px 14px;border-radius:8px;background:#1a1a2e;color:#38bdf8;font-size:12px;font-weight:600;border:1px solid #38bdf840;cursor:pointer;">Changer mon code</button>
              <button onclick="adminLogout()" style="padding:6px 14px;border-radius:8px;background:#1a1a2e;color:#f59e0b;font-size:12px;font-weight:600;border:1px solid #f59e0b40;cursor:pointer;">Déconnexion</button>
              <button onclick="closeAdmin()" style="width:32px;height:32px;border-radius:50%;background:#dc2626;color:#fff;font-size:18px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;">×</button>
            </div>
          </div>
          <div style="display:flex;gap:4px;padding:16px 24px 0;flex-wrap:wrap;">
            ${[

              { id:'informations', label:'ℹ️ Informations' },

              { id:'activite', label:'💪 Activité' },
              { id:'verifications', label:'🚒 Vérifications' },
              { id:'engins', label:'🔧 Engins/Matériels' },
              { id:'carousel', label:'📸 Carrousel' },
              { id:'parametres', label:'⚙️ Paramètres' }
            ].concat(currentAdminUser?.isSuperAdmin ? [
                { id:'utilisateurs', label:'🔑 Utilisateurs' },
                { id:'journal', label:'📋 Journal' }
              ] : [])
            .map(t => `
              <button onclick="switchAdminTab('${t.id}')"
                      id="admin-tab-${t.id}"
                      style="padding:8px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;cursor:pointer;border:none;
                             background:${adminTab===t.id?'#1a1a2e':'#0f1629'};
                             color:${adminTab===t.id?'#f59e0b':'#ffffff80'};
                             border-bottom:${adminTab===t.id?'2px solid #f59e0b':'2px solid transparent'};">
                ${t.label}
              </button>`).join('')}
          </div>
          <div id="admin-content" style="flex:1;overflow-y:auto;padding:24px;background:#1a1a2e;border-radius:0 0 14px 14px;">
            ${renderAdminTab(adminTab)}
          </div>
        </div>`;
      modal.addEventListener('click', e => { if (e.target === modal) closeAdmin(); });
      document.body.appendChild(modal);
    }

    window.switchAdminTab = function(tab) {
      adminTab = tab;
      ['personnel','infirmiers','informations','casernement','activite','verifications','engins','carousel','parametres','utilisateurs','journal'].forEach(t => {
        const btn = document.getElementById(`admin-tab-${t}`);
        if (!btn) return;
        btn.style.background = t === tab ? '#1a1a2e' : '#0f1629';
        btn.style.color = t === tab ? '#f59e0b' : '#ffffff80';
        btn.style.borderBottom = t === tab ? '2px solid #f59e0b' : '2px solid transparent';
      });
      const content = document.getElementById('admin-content');
      if (content) content.innerHTML = renderAdminTab(tab);
    };


    // ── Onglet Utilisateurs (Super Admin uniquement) ────────────────────────
    function renderAdminUtilisateurs() {
      const iStyle = 'box-sizing:border-box;padding:8px 10px;border-radius:8px;background:#1a1a2e;color:#fff;border:1px solid #f59e0b30;font-size:13px;outline:none;width:100%;';
      const fmt = d => d ? new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '?';
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <!-- Liste des utilisateurs -->
          <div>
            <h3 style="color:#f59e0b;font-size:13px;font-weight:700;margin:0 0 12px 0;text-transform:uppercase;">🔑 Accès actifs (${adminUsers.length})</h3>
            <div style="display:flex;flex-direction:column;gap:6px;max-height:480px;overflow-y:auto;">
              ${adminUsers.length === 0
                ? '<p style="color:#ffffff40;font-size:13px;font-style:italic;">Aucun utilisateur créé</p>'
                : adminUsers.map((u,i) => `
                  <div style="background:#16213e;border-radius:8px;padding:10px 12px;border-left:3px solid #f59e0b;">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                      <div style="flex:1;">
                        <p style="color:#fff;font-size:13px;font-weight:700;margin:0 0 2px 0;">👤 ${u.nom}</p>
                        <p style="color:#f59e0b80;font-size:11px;margin:0;">Code : <code style="background:#0f1629;padding:1px 5px;border-radius:4px;color:#fbbf24;">${u.code}</code></p>
                        ${u.email ? `<p style="color:#38bdf880;font-size:11px;margin:2px 0 0 0;">📧 ${u.email}</p>` : ''}
                        <p style="color:#ffffff50;font-size:11px;margin:2px 0 0 0;">Créé le ${fmt(u.createdAt)} par ${u.createdBy || '?'}</p>
                      </div>
                      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
                        ${u.email ? `<button onclick="adminResendMail(${i})"
                                style="padding:4px 10px;border-radius:6px;background:#38bdf8;color:#0f172a;font-size:11px;font-weight:700;border:none;cursor:pointer;">📧 Renvoyer</button>` : ''}
                        <button onclick="adminDeleteUser(${i})"
                                style="padding:4px 10px;border-radius:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;">× Supprimer</button>
                      </div>
                    </div>
                  </div>`).join('')}
            </div>
          </div>
          <!-- Créer un utilisateur -->
          <div>
            <h3 style="color:#f59e0b;font-size:13px;font-weight:700;margin:0 0 12px 0;text-transform:uppercase;">+ Créer un accès</h3>
            <div style="background:#16213e;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;">
              <div>
                <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">NOM PRÉNOM</label>
                <input id="new-user-nom" placeholder="Ex: Dupont Jean" style="${iStyle}">
              </div>
              <div>
                <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">ADRESSE MAIL <span style="color:#ffffff40;font-weight:400;">(pour envoi du code)</span></label>
                <input id="new-user-email" type="email" placeholder="jean.dupont@sdis53.fr" style="${iStyle}">
              </div>
              <div>
                <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">CODE D'ACCÈS PERSONNEL</label>
                <div style="display:flex;gap:6px;">
                  <input id="new-user-code" type="text" placeholder="Ex: SGT-DUPONT-2025" style="${iStyle}flex:1;">
                  <button onclick="adminGenerateCode()" style="padding:8px 12px;border-radius:8px;background:#334155;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;">🎲 Générer</button>
                </div>
                <p style="color:#ffffff40;font-size:11px;margin:4px 0 0 0;">Minimum 6 caractères.</p>
              </div>
              <div style="display:flex;gap:8px;">
                <button onclick="adminCreateUser(false)" style="flex:1;padding:10px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;border:none;cursor:pointer;">+ Créer l'accès</button>
                <button onclick="adminCreateUser(true)" style="flex:1;padding:10px;border-radius:8px;background:#38bdf8;color:#0f172a;font-size:13px;font-weight:700;border:none;cursor:pointer;">📧 Créer + Envoyer le code</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    window.adminGenerateCode = function() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 10; i++) code += chars[Math.floor(Math.random()*chars.length)];
      const inp = document.getElementById('new-user-code');
      if (inp) inp.value = code;
    };

    window.adminCreateUser = async function(sendMail) {
      var nom  = (document.getElementById('new-user-nom')?.value || '').trim();
      var email = (document.getElementById('new-user-email')?.value || '').trim();
      var code = (document.getElementById('new-user-code')?.value || '').trim();
      if (!nom)  { showSavingIndicator('✗ Nom requis', true); return; }
      if (!code || code.length < 6) { showSavingIndicator('✗ Code trop court (min 6 car.)', true); return; }
      if (adminUsers.find(function(u){ return u.code === code; })) { showSavingIndicator('✗ Ce code existe déjà', true); return; }
      if (code === SUPER_ADMIN_CODE) { showSavingIndicator('✗ Code réservé', true); return; }
      if (sendMail && !email) { showSavingIndicator('✗ Email requis pour l’envoi', true); return; }

      adminUsers.push({
        nom: nom,
        email: email,
        code: code,
        createdAt: new Date().toISOString(),
        createdBy: (currentAdminUser && currentAdminUser.nom) ? currentAdminUser.nom : 'Admin'
      });

      try {
        await saveAdminUsers();
      } catch(e) {
        console.warn('saveAdminUsers error:', e);
      }

      if (typeof auditEntry === 'function') {
        auditEntry('CRÉATION UTILISATEUR', 'Accès créé pour : ' + nom + ' (code: ' + code + ')');
      }

      showSavingIndicator('✓ Accès créé pour ' + nom);

      if (sendMail && email) {
        adminSendAccessMail(nom, email, code);
      }

      switchAdminTab('utilisateurs');
    };

    window.adminSendAccessMail = function(nom, email, code) {
      var centreName = (config && config.centre_name) ? config.centre_name : 'CIS Château-Gontier-sur-Mayenne';
      var identifiant = nom.toLowerCase().replace(/[\s]+/g, '.');
      var subject = encodeURIComponent('[' + centreName + '] Votre accès Administration');
      var lines = [
        'Bonjour ' + nom + ',',
        '',
        'Vous avez reçu un accès à l’application de gestion de garde du ' + centreName + '.',
        '',
        '--- VOS IDENTIFIANTS ---',
        '',
        'Identifiant : ' + identifiant,
        'Code d’accès : ' + code,
        '',
        '--- COMMENT SE CONNECTER ---',
        '',
        '1. Ouvrez l’application sur votre navigateur',
        '2. Cliquez sur le bouton Administration (⚙️)',
        '3. Saisissez votre identifiant et votre code d’accès',
        '',
        'Ce code est personnel et confidentiel. Ne le communiquez à personne.',
        '',
        'Cordialement,',
        'L’administrateur',
        centreName
      ];
      var body = encodeURIComponent(lines.join('\n'));
      window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
    };

        window.adminResendMail = function(idx) {
      var user = adminUsers[idx];
      if (!user) return;
      if (!user.email) {
        alert('Pas d’adresse mail enregistrée pour ' + user.nom + '.');
        return;
      }
      adminSendAccessMail(user.nom, user.email, user.code);
    };

    window.adminDeleteUser = async function(idx) {
      const user = adminUsers[idx];
      if (!user) return;
      if (!confirm('Supprimer l\'accès de ' + user.nom + ' ?')) return;
      adminUsers.splice(idx, 1);
      await saveAdminUsers();
      if (typeof auditEntry === 'function') auditEntry('SUPPRESSION UTILISATEUR', 'Accès supprimé pour : ' + user.nom);
      showSavingIndicator('✓ Accès supprimé');
      switchAdminTab('utilisateurs');
    };

    // ── Onglet Journal (Super Admin uniquement) ─────────────────────────────
    function renderAdminJournal() {
      const fmt = d => d ? new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '?';
      const colors = {

        'default': '#60a5fa'
      };
      const filterVal = window._journalFilter || '';
      const filtered = filterVal
        ? auditLog.filter(e => e.qui?.toLowerCase().includes(filterVal.toLowerCase()) || e.action?.toLowerCase().includes(filterVal.toLowerCase()) || e.detail?.toLowerCase().includes(filterVal.toLowerCase()))
        : auditLog;

      return `
        <div style="display:flex;flex-direction:column;gap:12px;height:100%;">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">

              <button onclick="if(confirm('Effacer tout le journal ?')){auditLog=[];saveAuditLog();switchAdminTab('journal');}"
                      style="padding:6px 12px;border-radius:8px;background:#7f1d1d;color:#fca5a5;font-size:12px;font-weight:700;border:none;cursor:pointer;">🗑️ Effacer</button>

            ${filtered.length === 0
              ? '<p style="color:#ffffff40;font-size:13px;font-style:italic;text-align:center;padding:20px;">Aucune entrée</p>'
              : filtered.map(e => `
                <div style="background:#16213e;border-radius:8px;padding:8px 12px;border-left:3px solid ${colors[e.action]||colors.default};display:flex;align-items:flex-start;gap:12px;">
                  <div style="flex-shrink:0;min-width:130px;">
                    <p style="color:#ffffff80;font-size:10px;margin:0;">${fmt(e.quand)}</p>
                  </div>
                  <div style="flex:1;min-width:0;">

    window.adminSaveNewCode = async function() {
      var isSuperAdmin = currentAdminUser && currentAdminUser.isSuperAdmin;
      var ancienEl = document.getElementById('cc-ancien');
      var ancien = ancienEl ? ancienEl.value.trim() : '';
      var nouveau = (document.getElementById('cc-nouveau') ? document.getElementById('cc-nouveau').value : '').trim();
      var confirme = (document.getElementById('cc-confirm') ? document.getElementById('cc-confirm').value : '').trim();
      var errEl = document.getElementById('cc-error');
      function showErr(msg) { if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; } }
      if (!nouveau || nouveau.length < 6) { showErr('Le code doit faire au moins 6 caract\u00e8res.'); return; }
      if (nouveau !== confirme) { showErr('Les deux codes ne correspondent pas.'); return; }
      if (isSuperAdmin) {
        showErr('Le code administrateur g\u00e9n\u00e9ral se change uniquement dans le fichier source.');
        return;
      }
      if (!ancien) { showErr('Saisissez votre code actuel.'); return; }
      if (ancien !== currentAdminUser.code) { showErr('Code actuel incorrect.'); return; }
      if (nouveau === SUPER_ADMIN_CODE) { showErr('Code r\u00e9serv\u00e9.'); return; }
      var already = adminUsers.find(function(u) { return u.code === nouveau && u.nom !== currentAdminUser.nom; });
      if (already) { showErr('Ce code est d\u00e9j\u00e0 utilis\u00e9.'); return; }
      var userIdx = adminUsers.findIndex(function(u) { return u.code === currentAdminUser.code; });
      if (userIdx > -1) {
        adminUsers[userIdx].code = nouveau;
        currentAdminUser.code = nouveau;
        try { await saveAdminUsers(); } catch(e) { console.warn(e); }
        if (typeof auditEntry === 'function') auditEntry('CHANGEMENT CODE', 'Code modifi\u00e9 par : ' + currentAdminUser.nom);
        showSavingIndicator('\u2713 Code mis \u00e0 jour');
        document.getElementById('change-code-modal').remove();
      } else {
        showErr('Utilisateur introuvable. Contactez l\'administrateur.');
      }
    };

    window.adminLogout = function() {

    };

    function renderAdminTab(tab) {
      if (tab === 'personnel') return renderAdminPersonnel();
      if (tab === 'infirmiers') return renderAdminInfirmiers();
      if (tab === 'informations') return renderAdminInformations();
      if (tab === 'casernement') return renderAdminCasernement();
      if (tab === 'activite') return renderAdminActivite();
      if (tab === 'verifications') return renderAdminVerifications();
      if (tab === 'engins') return renderAdminEngins();
      if (tab === 'carousel') return renderAdminCarousel();
      if (tab === 'parametres') return renderAdminParametres();
      if (tab === 'utilisateurs' && currentAdminUser?.isSuperAdmin) return renderAdminUtilisateurs();
      if (tab === 'journal' && currentAdminUser?.isSuperAdmin) return renderAdminJournal();
      return '';
    }

    window.adminImportExcel = async function(input) {
      const file = input.files[0];
      if (!file) return;

      // Charger SheetJS dynamiquement si pas encore présent
      if (!window.XLSX) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let rows = [];

          if (file.name.toLowerCase().endsWith('.csv')) {
            // Lecture CSV
            const text = new TextDecoder('utf-8').decode(e.target.result);
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            const headers = lines[0].split(/[,;]/).map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g,''));
            for (let i = 1; i < lines.length; i++) {
              const vals = lines[i].split(/[,;]/);
              const obj = {};
              headers.forEach((h, idx) => { obj[h] = (vals[idx] || '').trim(); });
              rows.push(obj);
            }
          } else {
            // Lecture XLSX
            const wb = window.XLSX.read(e.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const raw = window.XLSX.utils.sheet_to_json(ws, { defval: '' });
            rows = raw.map(r => {
              const norm = {};
              Object.keys(r).forEach(k => {
                norm[k.trim().toLowerCase().replace(/[^a-z0-9]/g, '')] = String(r[k]).trim();
              });
              return norm;
            });
          }

          // Normaliser et filtrer
          const parsed = [];
          const errors = [];
          rows.forEach((row, i) => {
            const nom = row['nom'] || row['name'] || row['prenom'] || '';
            const grade = row['grade'] || row['rang'] || '';
            const typeRaw = (row['type'] || '').toUpperCase();
            const type = typeRaw === 'PRO' || typeRaw === 'SPP' ? 'PRO' : typeRaw === 'SPV' ? 'SPV' : null;
            const equipe = row['equipe'] || row['equip'] || row['team'] || '';
            if (!nom || !grade || !type) {
              if (nom || grade) errors.push(`Ligne ${i + 2} ignorée : Nom="${nom}", Grade="${grade}", Type="${typeRaw}"`);
              return;
            }
            const specialites = ['SAV','USAR','RCH','MEA'].filter(s => {
              const v = (row[s.toLowerCase()] || '').toUpperCase();
              return v === 'OUI' || v === 'YES' || v === '1' || v === 'X' || v === '✓';
            });
            const isPro = type === 'PRO';
            const equipeVal = isPro ? null : (equipe || '1');
            parsed.push({ name: nom, grade, type, equipe: equipeVal, specialites });
          });

          showExcelPreview(parsed, errors);
        } catch(err) {
          alert('Erreur de lecture du fichier : ' + err.message);
        }
      };

      if (file.name.toLowerCase().endsWith('.csv')) {
        reader.readAsArrayBuffer(file);
      } else {
        reader.readAsArrayBuffer(file);
      }
      input.value = '';
    };

      if (!preview) return;

      const existing = new Set(availablePersonnel.map(p => (p.name || '').toLowerCase() + '_' + (p.type || '').toLowerCase()));

      const toUpdate = parsed.filter(p => existing.has((p.name||'').toLowerCase() + '_' + (p.type||'').toLowerCase()));

      preview.style.display = 'block';
      preview.innerHTML = `
        <div style="background:#16213e;border-radius:12px;padding:16px;margin-bottom:16px;border:2px solid #f59e0b40;">
          <h3 style="color:#f59e0b;font-size:14px;font-weight:700;margin:0 0 12px 0;">📊 Aperçu de l'import — ${parsed.length} agent(s) détecté(s)</h3>

          ${errors.length ? `<div style="background:#7f1d1d30;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;color:#fca5a5;">${errors.map(e=>`⚠ ${e}`).join('<br>')}</div>` : ''}

              </div>

              <p style="color:#60a5fa;font-size:12px;font-weight:700;margin:0 0 6px 0;">✏ Mises à jour (${toUpdate.length})</p>
              <div style="max-height:160px;overflow-y:auto;">
                ${toUpdate.length ? toUpdate.map(p=>`<div style="font-size:11px;color:#fff;padding:2px 0;">${p.grade} ${p.name} <span style="color:#f59e0b;">[${p.type} Éq.${p.equipe}]</span> ${p.specialites.length?p.specialites.map(s=>({SAV:'🤿',USAR:'⛏️',RCH:'☣️',MEA:'🚒'}[s]||s)).join(''):''}</div>`).join('') : '<span style="color:#ffffff40;font-size:11px;">Aucun</span>'}
              </div>

          <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="adminCancelImport()" style="padding:8px 16px;border-radius:8px;background:#1a1a2e;color:#fff;font-size:13px;font-weight:600;border:2px solid #ffffff20;cursor:pointer;">✕ Annuler</button>
            ${toUpdate.length ? `<button onclick="adminConfirmImport(${JSON.stringify(parsed).replace(/"/g,'&quot;')}, false)" style="padding:8px 16px;border-radius:8px;background:#3b82f6;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;">✚ Ajouter seulement (${toAdd.length})</button>` : ''}
            <button onclick="adminConfirmImport(${JSON.stringify(parsed).replace(/"/g,'&quot;')}, true)" style="padding:8px 16px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;border:none;cursor:pointer;">✓ Importer tout (${parsed.length})</button>
          </div>
        </div>`;
    }

    window.adminCancelImport = function() {
      const preview = document.getElementById('excel-import-preview');
      if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
    };

    window.adminConfirmImport = async function(parsed, includeUpdates) {
      if (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch(e) { return; } }
      const existing = new Set(availablePersonnel.map(p => (p.name||'').toLowerCase() + '_' + (p.type||'').toLowerCase()));
      let count = 0;

      for (const p of parsed) {
        const key = (p.name||'').toLowerCase() + '_' + (p.type||'').toLowerCase();
        const isNew = !existing.has(key);

        if (isNew) {
          availablePersonnel.push({ name: p.name, grade: p.grade, type: p.type, equipe: p.equipe, specialites: p.specialites });
          await saveData('personnel', { nom: p.name, grade: p.grade, equipe: p.equipe, personType: p.type, zone: p.type, notes: JSON.stringify({ specialites: p.specialites }) });
          count++;
        } else if (includeUpdates) {
          const idx = availablePersonnel.findIndex(x => (x.name||'').toLowerCase() === (p.name||'').toLowerCase() && (x.type||'').toLowerCase() === (p.type||'').toLowerCase());
          if (idx !== -1) {
            availablePersonnel[idx].grade = p.grade;
            availablePersonnel[idx].equipe = p.equipe;
            availablePersonnel[idx].specialites = p.specialites;
          }
          const rec = currentRecords.find(r => r && r.type === 'personnel' && sameName(r.nom, p.name));
          if (rec) {
            rec.grade = p.grade; rec.equipe = p.equipe;
            rec.notes = JSON.stringify({ specialites: p.specialites });
            await updateData(rec);
          } else {
            await saveData('personnel', { nom: p.name, grade: p.grade, equipe: p.equipe, personType: p.type, zone: p.type, notes: JSON.stringify({ specialites: p.specialites }) });
          }
          count++;
        }
      }

      showSavingIndicator(`✓ ${count} agent(s) importé(s)`);
      adminCancelImport();
      switchAdminTab('personnel');
      render();
    };

    window.adminEditPersonnel = function(name, type) {
      const p = availablePersonnel.find(x => x.name === name && x.type === type);
      if (!p) return;
      const specs = ['SAV','USAR','RCH','MEA'];
      const modal2 = document.createElement('div');
      modal2.id = 'admin-modal2';

    window.adminSavePersonnel = async function(name, type) {
      const grade = document.getElementById('edit-grade')?.value || '';
      const isPro = (type === 'PRO' || type === 'SPP');
      const equipeRaw = document.getElementById('edit-equipe')?.value?.trim() || '';
      const equipe = isPro ? (equipeRaw || null) : (equipeRaw || '1');
      const specialites = ['SAV','USAR','RCH','MEA'].filter(s => document.getElementById(`spec-check-${s}`)?.textContent === '✓');
      const idx = availablePersonnel.findIndex(p => p.name === name && p.type === type);
      if (idx !== -1) {
        availablePersonnel[idx].grade = grade;
        availablePersonnel[idx].equipe = equipe;
        availablePersonnel[idx].specialites = specialites;
      }
      const existingRecord = currentRecords.find(r => r && r.type === 'personnel' && sameName(r.nom, name) && ((r.personType==='PRO'?'SPP':(r.personType==='SPP'?'SPP':(r.personType||'SPV')))===type));
      if (existingRecord) {
        existingRecord.grade = grade;
        existingRecord.equipe = equipe;
        existingRecord.notes = JSON.stringify({ specialites });

      } else {
        await saveData('personnel', { nom: name, grade, equipe, personType: type, zone: type, notes: JSON.stringify({ specialites }) });

      const equipe = isPro ? null : (window.prompt('Équipe SPV (1,2,3,4,Externe)','1')||'1').trim();
      const person = { grade, name: nom.trim(), type, equipe, specialites: [] };
      availablePersonnel.push(person);
