      const btnDel = (onclick) => `<button onclick="${onclick}" style="padding:4px 10px;border-radius:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;flex-shrink:0;">×</button>`;

      const joursMap = {0:'Dim',1:'Lun',2:'Mar',3:'Mer',4:'Jeu',5:'Ven',6:'Sam'};

      const hebdoHtml = `
        <div style="background:#16213e;border-radius:10px;padding:14px 16px;margin-bottom:14px;">
          ${sectionTitle('📅','Informations hebdomadaires')}
          <p style="color:#ffffff50;font-size:12px;margin:0 0 10px 0;">Tâches affichées dans le slide Casernement selon le jour.</p>
          <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">
            ${allTigGproItems.map((item, i) => `
              <div style="padding:8px 10px;background:#1a1a2e;border-radius:8px;">
                <div style="display:flex;align-items:flex-start;gap:8px;">
                  <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px;">
                      <span style="background:#f59e0b;color:#1a1a2e;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;">${item.jour}</span>
                      ${item.monthlyFirstMonday ? '<span style="background:#6366f1;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;">1er lundi/mois</span>' : ''}
                      ${item.everyOtherWeekEven ? '<span style="background:#10b981;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;">Sem. paires</span>' : ''}
                      ${item.isTIG ? '<span style="background:#dc2626;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;">TIG</span>' : ''}
                    </div>
                    <div style="font-size:12px;color:#fff;line-height:1.4;">${(item.texte||'').substring(0,80)}${item.texte&&item.texte.length>80?'…':''}</div>
                    ${item.isTIG && item.tigItems && item.tigItems.length ? `
                    <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;">
                      ${item.tigItems.map(t => `<span style="background:#dc262620;color:#fca5a5;padding:2px 7px;border-radius:4px;font-size:10px;border:1px solid #dc262640;">${t}</span>`).join('')}
                    </div>` : ''}
                  </div>
                  <div style="display:flex;gap:4px;flex-shrink:0;">
                    <button onclick="adminEditHebdoItem(${i})" style="padding:4px 10px;border-radius:6px;background:#f59e0b;color:#1a1a2e;font-size:12px;font-weight:700;border:none;cursor:pointer;">✏️</button>
                    <button onclick="adminDeleteHebdoItem(${i})" style="padding:4px 10px;border-radius:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;">×</button>
                  </div>
                </div>
              </div>`).join('')}
          </div>
          <div style="background:#1a1a2e;border-radius:8px;padding:10px;">
            <p style="color:#f59e0b;font-size:11px;font-weight:700;margin:0 0 8px 0;">+ AJOUTER UNE ENTRÉE</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
              <div>
                <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">JOUR(S)</label>
                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                  ${joursNoms.map((j,i) => `
                    <label id="hebdo-new-jour-${i}" onclick="toggleAdminJour('hebdo-new',${i})"
                           style="padding:3px 7px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;
                                  background:#0f1629;color:#fff;border:1px solid #f59e0b30;">
                      ${j}
                    </label>`).join('')}
                </div>
              </div>
              <div>
                <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">FRÉQUENCE</label>
                <select id="hebdo-new-freq" style="width:100%;padding:5px 8px;border-radius:6px;background:#0f1629;color:#fff;border:1px solid #f59e0b30;font-size:12px;outline:none;">
                  <option value="">Chaque semaine</option>
                  <option value="monthly">1er lundi du mois</option>
                  <option value="biweekly">Toutes les 2 semaines (sem. paires)</option>
                </select>
              </div>
            </div>
            <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">TEXTE</label>
            <textarea id="hebdo-new-texte" rows="2" placeholder="Description de la tâche..."
                      style="width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;background:#0f1629;color:#fff;border:1px solid #f59e0b30;font-size:12px;outline:none;resize:none;margin-bottom:8px;"></textarea>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px;">
              <input type="checkbox" id="hebdo-new-istig" onchange="document.getElementById('hebdo-new-tig-section').style.display=this.checked?'block':'none'" style="width:14px;height:14px;accent-color:#dc2626;">
              <span style="color:#fca5a5;font-size:12px;font-weight:700;">Entrée TIG (liste de sous-tâches)</span>
            </label>
            <div id="hebdo-new-tig-section" style="display:none;background:#0f1629;border-radius:6px;padding:8px;margin-bottom:8px;border:1px solid #dc262640;">
              <div id="hebdo-new-tig-list" style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px;"></div>
              <div style="display:flex;gap:5px;">
                <input id="hebdo-new-tig-input" placeholder="Nouvelle sous-tâche..." style="flex:1;padding:4px 7px;border-radius:5px;background:#1a1a2e;color:#fff;border:1px solid #dc262640;font-size:11px;outline:none;">
                <button onclick="addNewTigItem()" style="padding:4px 10px;border-radius:5px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;border:none;cursor:pointer;">+</button>
              </div>
            </div>
            <button onclick="adminAddHebdoItem()" style="padding:7px 16px;border-radius:7px;background:#f59e0b;color:#1a1a2e;font-size:12px;font-weight:700;border:none;cursor:pointer;">+ Ajouter</button>
          </div>
          <button onclick="adminSaveHebdo()" style="margin-top:10px;padding:8px 16px;border-radius:8px;background:#22c55e;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;width:100%;">💾 Enregistrer toutes les modifications</button>
        </div>`;

      const allReserv = currentRecords.filter(r => r && r.type === 'notes' && r.zone === 'reservationSalle');
      const allMateriel = currentRecords.filter(r => r && r.type === 'notes' && r.zone === 'diversGpro');
      const toItem2 = (r) => ({ ...r, texte: r.notes || '', dateDebut: r.creneau || '', dateFin: r.grade || '' });
      const renderList2 = (items, delFn) => items.length ? items.map(item => `
        <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#1a1a2e;border-radius:8px;">
          <div style="flex:1;"><div style="font-size:13px;color:#fff;font-weight:600;">${item.texte||''}</div>
          <div style="font-size:11px;color:#f59e0b80;">${item.dateDebut?'Du '+fmtDate(item.dateDebut):''}${item.dateFin?' au '+fmtDate(item.dateFin):''}</div></div>
          ${btnDel(`${delFn}('${item.__backendId}')`)}
        </div>`).join('') : '<p style="color:#ffffff40;font-size:13px;font-style:italic;">Aucun élément</p>';

      const formSection2 = (idPrefix, addFn) => `
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">
          <div><label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">TEXTE</label>
          <textarea id="${idPrefix}-texte" rows="2" style="${iStyle}resize:none;"></textarea></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">DATE DÉBUT</label>
            <input id="${idPrefix}-debut" type="date" style="${iStyle}"></div>
            <div><label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">DATE FIN</label>
            <input id="${idPrefix}-fin" type="date" style="${iStyle}"></div>
          </div>
          <button onclick="${addFn}()" style="padding:8px 16px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;border:none;cursor:pointer;">+ Ajouter</button>
        </div>`;

      const reservHtml = `
        <div style="background:#16213e;border-radius:10px;padding:14px 16px;margin-bottom:14px;">
          ${sectionTitle('🏫','Réservation salle')}
          <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">${renderList2(allReserv.map(toItem2),'adminDeleteReservation')}</div>
          ${formSection2('reserv','adminAddReservation')}
        </div>`;

      const materielHtml = `
        <div style="background:#16213e;border-radius:10px;padding:14px 16px;">
          ${sectionTitle('🧰','Préparation matériel / Divers')}
          <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">${renderList2(allMateriel.map(toItem2),'adminDeleteMateriel')}</div>
          ${formSection2('materiel','adminAddMateriel')}
        </div>`;

      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>${hebdoHtml}</div>
        <div>${reservHtml}${materielHtml}</div>
      </div>`;
    }

    window.toggleAdminJour = function(prefix, i) {
      const label = document.getElementById(`${prefix}-jour-${i}`);
      if (!label) return;
      const active = label.dataset.active === '1';
      label.dataset.active = active ? '0' : '1';
      label.style.background = active ? '#0f1629' : '#f59e0b';
      label.style.color = active ? '#fff' : '#1a1a2e';
      label.style.borderColor = active ? '#f59e0b30' : '#f59e0b';
    };

    window.addNewTigItem = function() {
      const input = document.getElementById('hebdo-new-tig-input');
      const val = input?.value?.trim();
      if (!val) return;
      const list = document.getElementById('hebdo-new-tig-list');
      const idx = list.querySelectorAll('.new-tig-row').length;
      const div = document.createElement('div');
      div.className = 'new-tig-row';
      div.style.cssText = 'display:flex;align-items:center;gap:5px;';
      div.innerHTML = `<span style="flex:1;font-size:11px;color:#fff;padding:3px 6px;background:#1a1a2e;border-radius:4px;">${val}</span>
        <button onclick="this.parentElement.remove()" style="padding:2px 6px;border-radius:4px;background:#dc2626;color:#fff;font-size:11px;border:none;cursor:pointer;">×</button>`;
      div.dataset.value = val;
      list.appendChild(div);
      input.value = '';
      input.focus();
    };

    window.adminAddHebdoItem = function() {
      const texte = document.getElementById('hebdo-new-texte')?.value?.trim();
      if (!texte) { showSavingIndicator('✗ Texte requis', true); return; }
      const joursIdx = [1,2,3,4,5,6,0];
      const joursNoms = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
      const joursSelec = joursIdx.filter((_,i) => document.getElementById(`hebdo-new-jour-${i}`)?.dataset.active === '1');
      const joursLabel = joursSelec.map(j => joursNoms[joursIdx.indexOf(j)]).join(' & ') || 'Tous';
      const freq = document.getElementById('hebdo-new-freq')?.value || '';
      const isTIG = document.getElementById('hebdo-new-istig')?.checked || false;
      const tigItems = isTIG
        ? Array.from(document.querySelectorAll('.new-tig-row')).map(el => el.dataset.value).filter(Boolean)
        : [];
      const item = { jour: joursLabel, jours: joursSelec.length ? joursSelec : [1,2,3,4,5,6,0], texte, isTIG, tigItems };
      if (freq === 'monthly') item.monthlyFirstMonday = true;
      if (freq === 'biweekly') item.everyOtherWeekEven = true;
      allTigGproItems.push(item);
      showSavingIndicator('✓ Entrée ajoutée — pensez à enregistrer');
      switchAdminTab('casernement');
    };

    window.adminDeleteHebdoItem = function(i) {
      allTigGproItems.splice(i, 1);
      switchAdminTab('casernement');
    };

    window.adminEditHebdoItem = function(i) {
      const item = allTigGproItems[i];
      if (!item) return;
      const joursMap = [{v:1,l:'Lun'},{v:2,l:'Mar'},{v:3,l:'Mer'},{v:4,l:'Jeu'},{v:5,l:'Ven'},{v:6,l:'Sam'},{v:0,l:'Dim'}];
      const iStyle = 'width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;background:#1a1a2e;color:#fff;border:1px solid #f59e0b30;font-size:13px;outline:none;';
      const freq = item.monthlyFirstMonday ? 'monthly' : item.everyOtherWeekEven ? 'biweekly' : '';
      const old = document.getElementById('admin-hebdo-edit-modal');
      if (old) old.remove();
      const modal = document.createElement('div');
      modal.id = 'admin-hebdo-edit-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);padding:20px;';
      modal.innerHTML = `
        <div style="background:#16213e;border-radius:14px;padding:24px;width:520px;max-width:100%;max-height:85vh;overflow-y:auto;border:2px solid #f59e0b40;">
          <h3 style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;margin:0 0 16px 0;">✏️ Modifier l'entrée</h3>
          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:6px;">TEXTE PRINCIPAL</label>
          <textarea id="hebdo-edit-texte" rows="3" style="${iStyle}resize:vertical;margin-bottom:12px;">${item.texte||''}</textarea>
          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:6px;">JOUR(S) CONCERNÉS</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
            ${joursMap.map((j,idx) => `
              <label id="hebdo-edit-jour-${idx}" onclick="toggleAdminJour('hebdo-edit',${idx})"
                     data-active="${(item.jours||[]).includes(j.v)?'1':'0'}"
                     style="padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;
                            background:${(item.jours||[]).includes(j.v)?'#f59e0b':'#1a1a2e'};
                            color:${(item.jours||[]).includes(j.v)?'#1a1a2e':'#fff'};
                            border:2px solid ${(item.jours||[]).includes(j.v)?'#f59e0b':'#f59e0b30'};">
                ${j.l}
              </label>`).join('')}
          </div>
          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:6px;">FRÉQUENCE</label>
          <select id="hebdo-edit-freq" style="${iStyle}margin-bottom:16px;">
            <option value="" ${!freq?'selected':''}>Chaque semaine</option>
            <option value="monthly" ${freq==='monthly'?'selected':''}>1er lundi du mois</option>
            <option value="biweekly" ${freq==='biweekly'?'selected':''}>Toutes les 2 semaines (sem. paires)</option>
          </select>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" id="hebdo-edit-istig" ${item.isTIG?'checked':''} onchange="toggleHebdoTigSection()" style="width:15px;height:15px;accent-color:#dc2626;">
              <span style="color:#fca5a5;font-size:12px;font-weight:700;">C'est une entrée TIG (liste de sous-tâches)</span>
            </label>
          </div>
          <div id="hebdo-edit-tig-section" style="display:${item.isTIG?'block':'none'};background:#1a1a2e;border-radius:8px;padding:12px;margin-bottom:16px;border:1px solid #dc262640;">
            <label style="color:#fca5a5;font-size:11px;font-weight:700;display:block;margin-bottom:8px;">SOUS-TÂCHES TIG</label>
            <div id="hebdo-edit-tig-list" style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px;">
              ${(item.tigItems||[]).map((t,ti) => `
                <div style="display:flex;align-items:center;gap:6px;" id="tig-row-${ti}">
                  <input value="${t}" style="flex:1;padding:5px 8px;border-radius:6px;background:#0f1629;color:#fff;border:1px solid #dc262640;font-size:12px;outline:none;" id="tig-item-${ti}">
                  <button onclick="removeTigItem(${ti})" style="padding:3px 8px;border-radius:5px;background:#dc2626;color:#fff;font-size:12px;border:none;cursor:pointer;">×</button>
                </div>`).join('')}
            </div>
            <div style="display:flex;gap:6px;">
              <input id="tig-new-input" placeholder="Nouvelle sous-tâche..." style="flex:1;padding:5px 8px;border-radius:6px;background:#0f1629;color:#fff;border:1px solid #dc262640;font-size:12px;outline:none;">
              <button onclick="addTigItem()" style="padding:5px 12px;border-radius:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;">+ Ajouter</button>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <button onclick="document.getElementById('admin-hebdo-edit-modal').remove()" style="flex:1;padding:10px;border-radius:10px;background:#1a1a2e;color:#fff;font-size:14px;font-weight:600;border:2px solid #ffffff20;cursor:pointer;">Annuler</button>
            <button onclick="adminSaveHebdoEdit(${i})" style="flex:1;padding:10px;border-radius:10px;background:#f59e0b;color:#1a1a2e;font-size:14px;font-weight:700;border:none;cursor:pointer;">✓ Enregistrer</button>
          </div>
        </div>`;
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
      // Attacher au admin-modal pour éviter les problèmes de stacking context
      const adminModalEl = document.getElementById('admin-modal') || document.body;
      adminModalEl.appendChild(modal);
    };

    window.toggleHebdoTigSection = function() {
      const cb = document.getElementById('hebdo-edit-istig');
      const sec = document.getElementById('hebdo-edit-tig-section');
      if (sec) sec.style.display = cb?.checked ? 'block' : 'none';
    };

    window.addTigItem = function() {
      const input = document.getElementById('tig-new-input');
      const val = input?.value?.trim();
      if (!val) return;
      const list = document.getElementById('hebdo-edit-tig-list');
      const idx = list.querySelectorAll('[id^="tig-row-"]').length;
      const div = document.createElement('div');
      div.id = `tig-row-${idx}`;
      div.style.cssText = 'display:flex;align-items:center;gap:6px;';
      div.innerHTML = `
        <input value="${val}" style="flex:1;padding:5px 8px;border-radius:6px;background:#0f1629;color:#fff;border:1px solid #dc262640;font-size:12px;outline:none;" id="tig-item-${idx}">
        <button onclick="removeTigItem(${idx})" style="padding:3px 8px;border-radius:5px;background:#dc2626;color:#fff;font-size:12px;border:none;cursor:pointer;">×</button>`;
      list.appendChild(div);
      input.value = '';
      input.focus();
    };

    window.removeTigItem = function(idx) {
      const row = document.getElementById(`tig-row-${idx}`);
      if (row) row.remove();
    };

    window.adminSaveHebdoEdit = async function(i) {
      const texte = document.getElementById('hebdo-edit-texte')?.value?.trim() || '';
      const freq = document.getElementById('hebdo-edit-freq')?.value || '';
      const isTIG = document.getElementById('hebdo-edit-istig')?.checked || false;
      const joursMap = [{v:1},{v:2},{v:3},{v:4},{v:5},{v:6},{v:0}];
      const joursNomsFull = [{v:1,l:'Lun'},{v:2,l:'Mar'},{v:3,l:'Mer'},{v:4,l:'Jeu'},{v:5,l:'Ven'},{v:6,l:'Sam'},{v:0,l:'Dim'}];
      const joursSelec = joursMap.filter((_,idx) => document.getElementById(`hebdo-edit-jour-${idx}`)?.dataset.active === '1').map(j => j.v);
      const joursLabel = joursSelec.map(v => joursNomsFull.find(j=>j.v===v)?.l||'').filter(Boolean).join(' & ') || allTigGproItems[i]?.jour || '';
      // Récupérer les sous-tâches TIG
      const tigItems = [];
      if (isTIG) {
        document.querySelectorAll('[id^="tig-item-"]').forEach(inp => {
          const v = inp.value?.trim();
          if (v) tigItems.push(v);
        });
      }
      if (allTigGproItems[i]) {
        allTigGproItems[i].texte = texte;
        allTigGproItems[i].jour = joursLabel;
        allTigGproItems[i].jours = joursSelec.length ? joursSelec : allTigGproItems[i].jours;
        allTigGproItems[i].monthlyFirstMonday = freq === 'monthly';
        allTigGproItems[i].everyOtherWeekEven = freq === 'biweekly';
        allTigGproItems[i].isTIG = isTIG;
        allTigGproItems[i].tigItems = isTIG ? tigItems : [];
      }
      document.getElementById('admin-hebdo-edit-modal')?.remove();
      await adminSaveHebdo();
      switchAdminTab('casernement');
    };

    window.adminSaveHebdo = async function() {
      const data = JSON.stringify(allTigGproItems);
      const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'tigGproItems');
      if (existing) { existing.notes = data; await updateData(existing); }
      else { await saveData('config', { zone: 'tigGproItems', notes: data }); }
      showSavingIndicator('✓ Informations hebdomadaires enregistrées');
      render();
    };

    window.adminAddReservation = async function() {
      const texte = document.getElementById('reserv-texte')?.value?.trim();
      if (!texte) { showSavingIndicator('✗ Texte requis', true); return; }
      const dateDebut = document.getElementById('reserv-debut')?.value || '';
      const dateFin = document.getElementById('reserv-fin')?.value || '';
      await saveData('notes', { zone: 'reservationSalle', notes: texte, creneau: dateDebut, grade: dateFin });
      showSavingIndicator('✓ Réservation ajoutée');
      switchAdminTab('casernement');
      render();
    };

    window.adminDeleteReservation = async function(backendId) {
      const rec = currentRecords.find(r => String(r.__backendId) === String(backendId));
      if (rec) { await deleteData(rec); window.reservationSalleList = (window.reservationSalleList||[]).filter(i => String(i.__backendId) !== String(backendId)); }
      switchAdminTab('casernement');
      render();
    };

    window.adminAddMateriel = async function() {
      const texte = document.getElementById('materiel-texte')?.value?.trim();
      if (!texte) { showSavingIndicator('✗ Texte requis', true); return; }
      const dateDebut = document.getElementById('materiel-debut')?.value || '';
      const dateFin = document.getElementById('materiel-fin')?.value || '';

      const inputEl = document.getElementById(`verif-new-nom-${day}`);
      const nom = inputEl?.value?.trim();
      if (!nom) { showSavingIndicator('✗ Nom requis', true); return; }
      const id = nom.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
      window._adminVerifMap = window._adminVerifMap || {};
      if (!window._adminVerifMap[day]) window._adminVerifMap[day] = [];
      window._adminVerifMap[day].push({ id, nom });
      if (inputEl) inputEl.value = '';
      switchAdminTab('verifications');

      window._adminVerifMap?.[day]?.splice(i, 1);
      switchAdminTab('verifications');

      showSavingIndicator('✓ Vérifications sauvegardées');
      switchAdminTab('verifications');

    // ── Onglet Activité Physique ─────────────────────

        3:{type:'Natation',creneau:'7h00 - 8h00'},

          ${[1,2,3,4,5,6].map(day => `

              <span style="color:#f59e0b;font-size:13px;font-weight:700;">${jours[day]}</span>
              <div style="display:flex;flex-direction:column;gap:4px;flex:1;">
                <select id="admin-act-type-${day}" style="${inputStyle}width:100%;" onchange="adminUpdateActivite(${day})">
                  ${activites.map(a => `<option value="${a}" ${(defauts[day]?.type||'')===a?'selected':''}>${a}</option>`).join('')}
                </select>
                <input id="admin-act-custom-${day}" value="${!activites.includes(defauts[day]?.type||'')?defauts[day]?.type||'':''}"
                       placeholder="Saisir l'activité personnalisée..."
                       style="${inputStyle}width:100%;display:${!activites.includes(defauts[day]?.type||'')?'block':'none'};"
                       onchange="adminUpdateActivite(${day})">
              </div>
              <input id="admin-act-creneau-${day}" value="${defauts[day]?.creneau||'8h30 - 10h00'}"

        </div>`;
    }

    window.adminUpdateActivite = function(day) {
      const sel = document.getElementById(`admin-act-type-${day}`);
      const customInput = document.getElementById(`admin-act-custom-${day}`);
      const creneau = document.getElementById(`admin-act-creneau-${day}`)?.value || '';
      if (!sel) return;
      if (customInput) {
        customInput.style.display = sel.value === 'Autre' ? 'block' : 'none';
      }
      const type = sel.value === 'Autre'
        ? (customInput?.value?.trim() || 'Autre')
        : sel.value;
      if (!window._adminActivites) window._adminActivites = {};
      window._adminActivites[day] = { type, creneau };
    };

    window.adminSaveActivites = async function() {
      const data = window._adminActivites || {};
      const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'activitesParDefaut');
      const notes = JSON.stringify(data);
      if (existing) { existing.notes = notes; await updateData(existing); }
      else { await saveData('config', { zone: 'activitesParDefaut', notes }); }
      showSavingIndicator('✓ Activités enregistrées');
      switchAdminTab('activite');

              <div style="padding:10px;flex:1;display:flex;flex-direction:column;gap:4px;">
                <p style="color:#f59e0b;font-size:13px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${f.titre || '<i style="opacity:0.5">Sans titre</i>'}</p>
                <p style="color:#ffffff80;font-size:11px;margin:0;line-height:1.3;overflow:hidden;max-height:34px;">${f.description || ''}</p>
                ${f.dateDebut ? `<p style="color:#f59e0b60;font-size:10px;margin:0;">📅 ${f.dateDebut}${f.dateFin?' → '+f.dateFin:''}</p>` : ''}
              </div>
              <div style="display:flex;gap:6px;padding:8px 10px;border-top:1px solid #ffffff10;">
                <button onclick="adminEditCarouselFiche(${i},'${zone}')" style="flex:1;padding:5px;border-radius:6px;background:#f59e0b;color:#1a1a2e;font-size:12px;font-weight:700;border:none;cursor:pointer;">✏️ Modifier</button>
                <button onclick="adminDeleteCarouselFiche(${i},'${zone}')" style="padding:5px 10px;border-radius:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;">×</button>
              </div>
            </div>
          `).join('')}

    window.renderAdminCarouselZone = function(zone) {
      const content = document.getElementById('admin-content');
      if (content) content.innerHTML = renderAdminCarousel(zone);
    };

    function showCarouselModal(fiche, onSave) {
      const old = document.getElementById('carousel-modal');
      if (old) old.remove();
      const iStyle = 'box-sizing:border-box;padding:8px 10px;border-radius:8px;background:#1a1a2e;color:#fff;border:1px solid #f59e0b30;font-size:13px;outline:none;width:100%;margin-bottom:10px;';
      const modal = document.createElement('div');
      modal.id = 'carousel-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);';
      modal.innerHTML = `
        <div style="background:#16213e;border-radius:14px;padding:24px;width:420px;max-width:95vw;border:2px solid #f59e0b40;max-height:90vh;overflow-y:auto;">
          <h3 style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 16px 0;">📸 Fiche carrousel</h3>

          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">TITRE</label>
          <input id="cf-titre" value="${fiche.titre||''}" placeholder="Ex: Nouveau poteau incendie" style="${iStyle}">

          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">DESCRIPTION</label>
          <textarea id="cf-desc" rows="3" placeholder="Ex: Rue des Acacias — mis en service le 01/04/2026" style="${iStyle}resize:none;">${fiche.description||''}</textarea>

          <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">PHOTO / VIDÉO</label>
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
            <div id="cf-photo-preview" style="width:72px;height:72px;border-radius:8px;background:#0f1629;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              ${fiche.photo
                ? (fiche.mediaType === 'video'
                    ? `<span style="font-size:28px;">🎬</span>`
                    : `<img src="${fiche.photo}" style="width:100%;height:100%;object-fit:cover;">`)
                : `<span style="font-size:28px;opacity:0.3;">📸</span>`}
            </div>
            <div style="flex:1;">
              <label style="display:inline-block;padding:7px 14px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:4px;">
                📁 Choisir photo ou vidéo
                <input type="file" accept="image/*,video/*" onchange="carouselPhotoPreview(this)" style="display:none;">
              </label>
              <p style="color:#ffffff40;font-size:10px;margin:2px 0 4px 0;">Images : JPG, PNG — Vidéos : MP4, WebM</p>
              ${fiche.photo ? `<button onclick="carouselClearPhoto()" style="display:block;padding:4px 10px;border-radius:6px;background:#dc2626;color:#fff;font-size:11px;border:none;cursor:pointer;">Supprimer</button>` : ''}
            </div>
          </div>
          <input type="hidden" id="cf-photo-data" value="${fiche.photo||''}">
          <input type="hidden" id="cf-media-type" value="${fiche.mediaType||'image'}">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
            <div>
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">DATE DÉBUT <span style="color:#ffffff40;font-weight:400;">(optionnel)</span></label>
              <input id="cf-debut" type="date" value="${fiche.dateDebut||''}" style="${iStyle}margin-bottom:0;">
            </div>
            <div>
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">DATE FIN <span style="color:#ffffff40;font-weight:400;">(optionnel)</span></label>
              <input id="cf-fin" type="date" value="${fiche.dateFin||''}" style="${iStyle}margin-bottom:0;">
            </div>
          </div>
          <p style="color:#ffffff40;font-size:11px;margin:0 0 16px 0;">Sans date → toujours visible. Avec dates → visible uniquement pendant la période.</p>

          <div style="display:flex;gap:10px;">
            <button onclick="document.getElementById('carousel-modal').remove()" style="flex:1;padding:10px;border-radius:10px;background:#1a1a2e;color:#fff;font-size:13px;font-weight:600;border:2px solid #ffffff20;cursor:pointer;">Annuler</button>
            <button onclick="carouselSaveFiche()" style="flex:1;padding:10px;border-radius:10px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;border:none;cursor:pointer;">✓ Enregistrer</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      window._carouselSaveCallback = onSave;
    }

    window.carouselPhotoPreview = function(input) {
      const file = input.files[0];
      if (!file) return;
      const isVideo = file.type.startsWith('video/');
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('cf-photo-data').value = e.target.result;
        document.getElementById('cf-media-type').value = isVideo ? 'video' : 'image';
        const preview = document.getElementById('cf-photo-preview');
        if (preview) {
          if (isVideo) {
            preview.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;"><span style="font-size:26px;">🎬</span><span style="font-size:9px;color:#f59e0b;font-weight:700;">VIDÉO</span></div>`;
          } else {
            preview.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
          }
        }
      };
      reader.readAsDataURL(file);
    };

    window.carouselClearPhoto = function() {
      document.getElementById('cf-photo-data').value = '';
      document.getElementById('cf-media-type').value = 'image';
      const preview = document.getElementById('cf-photo-preview');
      if (preview) preview.innerHTML = `<span style="font-size:28px;opacity:0.3;">📸</span>`;
    };

    window.carouselSaveFiche = function() {
      const fiche = {
        titre: document.getElementById('cf-titre')?.value?.trim() || '',
        description: document.getElementById('cf-desc')?.value?.trim() || '',
        photo: document.getElementById('cf-photo-data')?.value || '',
        mediaType: document.getElementById('cf-media-type')?.value || 'image',
        dateDebut: document.getElementById('cf-debut')?.value || '',
        dateFin: document.getElementById('cf-fin')?.value || '',
      };
      document.getElementById('carousel-modal')?.remove();
      if (window._carouselSaveCallback) window._carouselSaveCallback(fiche);
    };

    window.adminAddCarouselFiche = function(zone) {
      zone = zone || 'communication';
      showCarouselModal({}, async function(fiche) {
        const type = zone === 'amicale' ? 'carousel_amicale' : 'carousel_fiche';
        await saveData(type, { zone, notes: JSON.stringify(fiche) });
        renderAdminCarouselZone(zone);
      });
    };

    window.adminEditCarouselFiche = function(idx, zone) {
      zone = zone || 'communication';
      const list = zone === 'amicale' ? (window.carouselAmicale || []) : (window.carouselFiches || []);
      const fiche = list[idx];
      if (!fiche) return;
      showCarouselModal(fiche, async function(updated) {
        const rec = currentRecords.find(r => r.__backendId === fiche.__backendId || r.id === fiche.id);
        if (rec) {
          rec.notes = JSON.stringify(updated);
          await updateData(rec);
        } else {
          const type = zone === 'amicale' ? 'carousel_amicale' : 'carousel_fiche';
          await saveData(type, { zone, notes: JSON.stringify(updated) });
        }
        renderAdminCarouselZone(zone);
      });
    };

    window.adminDeleteCarouselFiche = async function(idx, zone) {
      zone = zone || 'communication';
      const list = zone === 'amicale' ? (window.carouselAmicale || []) : (window.carouselFiches || []);
      const fiche = list[idx];
      if (!fiche) return;
      if (!confirm(`Supprimer la fiche "${fiche.titre || 'sans titre'}" ?`)) return;
      const rec = currentRecords.find(r => r.__backendId === fiche.__backendId || r.id === fiche.id);
      if (rec) await deleteData(rec);
      renderAdminCarouselZone(zone);
    };

              <h3 style="color:#f59e0b;font-size:13px;font-weight:700;margin:0 0 10px 0;text-transform:uppercase;">🖼️ Logo du centre</h3>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                <div style="width:60px;height:60px;border-radius:8px;overflow:hidden;background:#0f1629;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  ${hasLogo ? `<img src="${currentLogo}" style="width:100%;height:100%;object-fit:contain;">` : '<span style="color:#ffffff40;font-size:24px;">🖼️</span>'}
                </div>
                <div>
                  <p style="color:#fff8;font-size:12px;margin:0 0 6px 0;">PNG recommandé (fond transparent)</p>
                  <label style="display:inline-block;padding:7px 14px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;cursor:pointer;">
                    📁 Choisir
                    <input type="file" accept="image/*" onchange="adminUploadLogo(this)" style="display:none;">
                  </label>
                  ${hasLogo ? `<button onclick="adminRemoveLogo()" style="margin-left:8px;padding:7px 12px;border-radius:8px;background:#dc2626;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;">Supprimer</button>` : ''}
                </div>
              </div>
            </div>
            <div style="background:#16213e;border-radius:10px;padding:14px 16px;">
              <h3 style="color:#f59e0b;font-size:13px;font-weight:700;margin:0 0 10px 0;text-transform:uppercase;">🔑 Sécurité & Serveur</h3>
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">MOT DE PASSE ADMIN</label>
              <input id="param-pwd" type="password" placeholder="Nouveau mot de passe" style="width:100%;${iStyle}margin-bottom:4px;">
              <p style="color:#ffffff40;font-size:11px;margin:0 0 10px 0;">Actif jusqu'au rechargement de la page</p>
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">ADRESSE DU SERVEUR</label>
              <div style="display:flex;gap:6px;margin-bottom:6px;">
                <input id="param-server" value="${window.JSON_SERVER_URL || 'http://172.18.25.25:80'}" style="flex:1;${iStyle}margin-bottom:0;">
                <button onclick="adminTestServer()" style="padding:6px 12px;border-radius:8px;background:#16213e;color:#f59e0b;font-size:12px;font-weight:700;border:2px solid #f59e0b40;cursor:pointer;white-space:nowrap;">🔍 Tester</button>
              </div>
              <div id="server-status-indicator" style="margin-bottom:10px;padding:7px 10px;border-radius:7px;font-size:12px;font-weight:600;background:${window.serverOnline===false?'#7f1d1d30':'#14532d30'};color:${window.serverOnline===false?'#fca5a5':'#86efac'};">
                ${window.serverOnline===false ? '🔴 Serveur hors ligne' : '🟢 Serveur connecté — ' + (window.JSON_SERVER_URL||'')}
              </div>
              <p style="color:#ffffff40;font-size:11px;margin:0 0 8px 0;">💡 Sur les autres PC du réseau, saisissez l'IP du PC principal (ex: http://192.168.1.10) puis cliquez Enregistrer. L'adresse est mémorisée sur ce navigateur.</p>
              <button onclick="adminSaveSecurite()" style="padding:8px 16px;border-radius:8px;background:#f59e0b;color:#1a1a2e;font-size:13px;font-weight:700;border:none;cursor:pointer;">💾 Enregistrer</button>
            </div>

            <!-- Bloc Commande O² -->
            <div style="background:#16213e;border-radius:10px;padding:14px 16px;">
              <h3 style="color:#38bdf8;font-size:13px;font-weight:700;margin:0 0 10px 0;text-transform:uppercase;">📧 Commande O²</h3>
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">ADRESSE MAIL DESTINATAIRE</label>
              <input id="param-o2-mail" value="${window.o2MailConfig?.email || 'pharmacie.departementale@sdis53.fr'}"
                     placeholder="email@sdis53.fr" style="width:100%;${iStyle}margin-bottom:8px;">
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">OBJET DU MAIL</label>
              <input id="param-o2-subject" value="${window.o2MailConfig?.subject || 'Commande O\u00b2 - CIS Château-Gontier-sur-Mayenne'}"
                     placeholder="Objet du mail..." style="width:100%;${iStyle}margin-bottom:8px;">
              <label style="color:#f59e0b;font-size:11px;font-weight:700;display:block;margin-bottom:4px;">SIGNATURE (fin du mail)</label>
              <textarea id="param-o2-signature" rows="3"
                        style="width:100%;${iStyle}resize:none;margin-bottom:10px;"
                        placeholder="Le chef de garde&#10;CIS Château-Gontier-sur-Mayenne">${(window.o2MailConfig && window.o2MailConfig.signature) ? window.o2MailConfig.signature : 'Le chef de garde\nCIS Château-Gontier-sur-Mayenne'}</textarea>
              <button onclick="adminSaveO2Config()" style="padding:8px 16px;border-radius:8px;background:#38bdf8;color:#0f172a;font-size:13px;font-weight:700;border:none;cursor:pointer;">💾 Enregistrer</button>
            </div>
          </div>
          <div style="background:#16213e;border-radius:10px;padding:14px 16px;">
            <h3 style="color:#f59e0b;font-size:13px;font-weight:700;margin:0 0 6px 0;text-transform:uppercase;">💡 Informations</h3>
            <p style="color:#ffffff80;font-size:13px;line-height:1.6;">
              Ce panneau d'administration permet de gérer :<br><br>
              • <b>Personnel</b> : ajouter/modifier/supprimer des agents (PRO et SPV), définir leurs équipes et spécialités.<br><br>
              • <b>Infirmiers</b> : gérer la liste des infirmiers disponibles à la sélection.<br><br>
              • <b>Informations</b> : saisir les infos quotidiennes, présences médicales, voies barrées, et notes GLI avec plages de dates.<br><br>
              • <b>Casernement</b> : modifier les tâches hebdomadaires, réservations de salle et préparation matériel.<br><br>
              • <b>Activité</b> : configurer les activités physiques par défaut selon les jours.<br><br>
              • <b>Vérifications</b> : adapter la liste des engins à vérifier pour chaque jour.<br><br>
              <span style="color:#f59e0b;">Toutes les données sont synchronisées en temps réel avec le serveur.</span>
            </p>
          </div>
        </div>`;
    }

    window.adminUploadLogo = function(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const b64 = e.target.result;
        const imgEl = document.querySelector('#app img[alt="Logo CIS"]');
        if (imgEl) imgEl.src = b64;
        (async () => {
          const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'logoData');
          if (existing) { existing.notes = b64; await updateData(existing); }
          else { await saveData('config', { zone: 'logoData', notes: b64 }); }
          showSavingIndicator('✓ Logo mis à jour');
          switchAdminTab('parametres');
          render();
        })();
      };
      reader.readAsDataURL(file);
    };

    window.adminRemoveLogo = async function() {
      const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'logoData');
      if (existing) await deleteData(existing);
      showSavingIndicator('✓ Logo supprimé');
      switchAdminTab('parametres');
      render();
    };

    window.adminSaveParametres = function() {
      const centre = document.getElementById('param-centre')?.value?.trim();
      if (centre) config.centre_name = centre;
      showSavingIndicator('✓ Nom du centre mis à jour');
      render();
      switchAdminTab('parametres');
    };

    window.adminSaveO2Config = async function() {
      const email = document.getElementById('param-o2-mail')?.value?.trim();
      const subject = document.getElementById('param-o2-subject')?.value?.trim();
      const signature = document.getElementById('param-o2-signature')?.value?.trim();
      if (!email) { showSavingIndicator('✗ Adresse mail requise', true); return; }
      window.o2MailConfig = { email, subject, signature };
      // Sauvegarder sur le serveur
      const existing = currentRecords.find(r => r && r.type === 'config' && r.zone === 'o2MailConfig');
      const data = JSON.stringify(window.o2MailConfig);
      if (existing) {
        existing.notes = data;
        await window.dataSdk?.update(existing);
      } else {
        const result = await window.dataSdk?.create({
          id: 'o2MailConfig_' + Date.now(),
          type: 'config', zone: 'o2MailConfig',
          notes: data,
          dayOfWeek: 0, weekKey: 'global', week_key: 'global', day_of_week: 0,
          createdAt: new Date().toISOString()
        });
        if (result?.isOk && result.value) currentRecords = upsertRecordByBackendId(currentRecords, result.value);
      }
      if (typeof auditEntry === 'function') auditEntry('MODIFICATION PARAMÈTRES', 'Config O² mise à jour : ' + email);
      showSavingIndicator('✓ Configuration O² enregistrée');
      switchAdminTab('parametres');
    };

    window.adminSaveSecurite = function() {
      const pwd = document.getElementById('param-pwd')?.value;
      const server = document.getElementById('param-server')?.value?.trim();
      if (pwd?.trim()) window.ADMIN_PASSWORD_OVERRIDE = pwd.trim();
      if (server && server !== window.JSON_SERVER_URL) {
        window.JSON_SERVER_URL = server;
        localStorage.setItem('chg_server_url', server);
        // Relancer la connexion avec la nouvelle URL
        if (window.dataSdk) {
          window.dataSdk.init(dataHandler).then(r => {
            if (r.isOk) showSavingIndicator('✓ Serveur connecté');
            else showSavingIndicator('⚠️ Serveur inaccessible', true);
          });
        }
      } else if (server) {
        localStorage.setItem('chg_server_url', server);
      }
      showSavingIndicator('✓ Paramètres enregistrés');
      switchAdminTab('parametres');
    };

    startDepartureAlertPolling();

    // Raccourci Ctrl+Shift+D : alerte de test (appuyer à nouveau pour fermer)
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'D') {
        e.preventDefault();
        if (activeDepartureAlert) {
          clearDepartureAlert();
        } else {
          showDepartureAlert({
            type: 'FEU DE MAISON',
            address: '12 Rue des Pompiers',
            city: 'Château-Gontier-sur-Mayenne',
            vehicles: ['FPT 55', 'VSAV 1'],
            notes: 'Alerte de test — Ctrl+Shift+D',
            latitude: 47.8236,
            longitude: -0.7072
          });
        }
      }
    });

    init();
  </script>
 </body>
</html>
