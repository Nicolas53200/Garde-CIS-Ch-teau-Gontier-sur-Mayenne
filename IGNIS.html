<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGNIS NOVA — Portail</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Source Sans Pro', sans-serif;
      background: #0a0f1e;
      color: #fff;
      overflow: hidden;
    }

    /* ── Fond animé ── */
    .bg-anim {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(239,68,68,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59,130,246,.1) 0%, transparent 60%),
        linear-gradient(135deg, #06091a 0%, #0d1b2e 50%, #06091a 100%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Layout central ── */
    .portal {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px;
    }

    /* ── Logo ── */
    .logo-wrap { margin-bottom: 8px; }
    .logo-img {
      height: clamp(100px, 12vw, 170px);
      object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(239,68,68,.45)) drop-shadow(0 0 55px rgba(59,130,246,.28)) brightness(1.12);
      animation: logoGlow 4s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 28px rgba(239,68,68,.45)) drop-shadow(0 0 55px rgba(59,130,246,.28)) brightness(1.12); }
      50%       { filter: drop-shadow(0 0 40px rgba(239,68,68,.7))  drop-shadow(0 0 80px rgba(59,130,246,.45)) brightness(1.2); }
    }
    .logo-sep {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,.6), transparent);
      margin: 12px auto 0;
    }

    /* ── Titre ── */
    .portal-title {
      color: #94a3b8;
      font-size: clamp(11px, 1.2vw, 14px);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 28px;
    }

    /* ── Carrousel ── */
    .carousel-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 580px;
    }
    .carousel-btn {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,.25);
      background: rgba(15,23,42,.6);
      color: #ef4444;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .carousel-btn:hover {
      border-color: rgba(239,68,68,.6);
      background: rgba(239,68,68,.12);
    }
    .carousel-viewport { flex: 1; overflow: hidden; }

    .centre-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(13,27,46,.8);
      border: 1px solid rgba(239,68,68,.18);
      border-radius: 18px;
      padding: 18px 22px;
      cursor: pointer;
      transition: all .25s;
      user-select: none;
      animation: slideIn .35s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .centre-card:hover {
      border-color: rgba(239,68,68,.5);
      background: rgba(239,68,68,.07);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(239,68,68,.15);
    }
    .centre-icon {
      width: 52px; height: 52px;
      background: rgba(239,68,68,.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      border: 1px solid rgba(239,68,68,.25);
    }
    .centre-info { flex: 1; min-width: 0; }
    .centre-nom {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .centre-dept {
      color: #64748b;
      font-size: 13px;
      margin-top: 2px;
    }
    .centre-type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-top: 6px;
      display: inline-block;
    }
    .badge-volontaire { background: rgba(59,130,246,.18); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
    .badge-mixte { background: rgba(245,158,11,.18); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
    .badge-mixte24h { background: rgba(168,85,247,.18); color: #c084fc; border: 1px solid rgba(168,85,247,.3); }
    .centre-arrow {
      color: #334155;
      font-size: 20px;
      flex-shrink: 0;
      transition: color .2s;
    }
    .centre-card:hover .centre-arrow { color: #ef4444; }

    /* ── Dots ── */
    .dots-wrap {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #334155;
      cursor: pointer;
      transition: all .2s;
    }
    .dot.active {
      background: #ef4444;
      border-color: #ef4444;
      width: 22px;
      border-radius: 4px;
    }

    /* ── Chargement ── */
    .loading-card {
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      background: rgba(13,27,46,.8);
      border: 1px solid rgba(239,68,68,.18);
      border-radius: 18px;
      padding: 28px;
      color: #475569;
      font-size: 15px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(239,68,68,.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bouton gérer ── */
    .btn-gestion {
      position: fixed;
      top: 16px; right: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      color: #64748b;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all .2s;
      z-index: 10;
    }
    .btn-gestion:hover { color: #f59e0b; border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.07); }

    /* Badge "X nouveaux feedbacks" sur le bouton Gérer les centres */
    .feedback-badge {
      position: absolute;
      top: -7px; right: -7px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px; height: 18px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      box-shadow: 0 0 0 2px #0a1220;
      animation: feedbackPulse 1.8s ease-in-out infinite;
    }
    @keyframes feedbackPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* ── Version ── */
    .version {
      position: fixed;
      bottom: 20px;
      color: #1e293b;
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 10;
    }

    /* ── Modale générique ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: #0d1b2e;
      border: 1px solid rgba(245,158,11,.2);
      border-radius: 20px;
      padding: 28px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-title {
      color: #f59e0b;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close {
      color: #475569; cursor: pointer; font-size: 20px; line-height: 1;
      background: none; border: none;
      transition: color .15s;
    }
    .modal-close:hover { color: #ef4444; }

    /* ── Formulaire ── */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      color: #94a3b8; font-size: 11px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus { border-color: rgba(245,158,11,.5); }
    .form-select option { background: #0d1b2e; }

    /* Champ mot de passe avec bouton œil personnalisé (icône native du
       navigateur trop peu visible sur fond sombre — voir password-toggle) */
    .password-wrap { position: relative; }
    .password-wrap .form-input { padding-right: 42px; }
    .password-toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; padding: 0;
      color: #fff; opacity: .55;
      transition: opacity .15s;
    }
    .password-toggle:hover { opacity: 1; }
    .password-toggle svg { width: 18px; height: 18px; display: block; }
    /* Edge affiche son propre œil natif par-dessus le nôtre : on le masque */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear { display: none; }

    /* Type selector cards */
    .type-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .type-card {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: rgba(255,255,255,.03);
    }
    .type-card:hover { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.06); }
    .type-card.selected { border-color: #f59e0b; background: rgba(245,158,11,.1); }
    .type-card .tc-icon { font-size: 26px; margin-bottom: 6px; }
    .type-card .tc-name { font-size: 12px; font-weight: 700; color: #e2e8f0; }
    .type-card .tc-sub { font-size: 10px; color: #64748b; margin-top: 2px; }

    /* Séparateur section */
    .section-sep {
      border: none;
      border-top: 1px solid rgba(255,255,255,.07);
      margin: 20px 0;
    }

    /* Boutons modale */
    .btn-primary {
      padding: 12px 20px;
      border-radius: 10px;
      background: #f59e0b;
      color: #111;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .btn-primary:hover { background: #fbbf24; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      padding: 12px 20px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: #94a3b8;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,.1);
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.1); color: #fff; }
    .btn-danger {
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(239,68,68,.12);
      color: #ef4444;
      font-size: 12px;
      border: 1px solid rgba(239,68,68,.25);
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .btn-danger:hover { background: rgba(239,68,68,.25); }

    /* Liste CIS dans gestion */
    .cis-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      gap: 10px;
    }
    .cis-item-info { flex: 1; min-width: 0; }
    .cis-item-nom { font-size: 14px; font-weight: 700; }
    .cis-item-meta { color: #64748b; font-size: 12px; margin-top: 2px; }
    .cis-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Notification toast */
    .toast {
      position: fixed;
      bottom: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13,27,46,.95);
      border: 1px solid rgba(245,158,11,.3);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 99999;
      color: #f59e0b;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      animation: toastIn .25s ease;
    }
    .toast.error { color: #ef4444; border-color: rgba(239,68,68,.3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .toast.out { animation: toastOut .25s ease forwards; }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

    /* Code secret ── */
    .code-dots {
      display: flex; gap: 10px; justify-content: center; margin: 16px 0;
    }
    .code-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(239,68,68,.4);
      background: transparent;
      transition: all .15s;
    }
    .code-dot.filled { background: #ef4444; border-color: #ef4444; }

    /* Alerte hors-ligne */
    .offline-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: linear-gradient(90deg, #7f1d1d, #dc2626, #7f1d1d);
      color: #fff;
      text-align: center; padding: 10px 16px;
      font-size: 14px; font-weight: 700; z-index: 9998;
      display: none; align-items: center; justify-content: center; gap: 8px;
      animation: bannerPulse 2s ease-in-out infinite;
    }
    .offline-banner.show { display: flex; }
    @keyframes bannerPulse { 0%,100%{opacity:1} 50%{opacity:.85} }
  </style>
</head>
<body>

<div class="bg-anim"></div>
<div class="bg-grid"></div>

<!-- Bannière hors-ligne -->
<div class="offline-banner" id="offline-banner">
  🔴 Serveur IGNIS hors ligne —
  <span id="offline-detail" style="font-weight:400;opacity:.9;margin-left:6px;"></span>
  <button onclick="diagnostic()" style="margin-left:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">🩺 Diagnostic</button>
</div>

<!-- Bouton gestion -->
<button class="btn-gestion" onclick="ouvrirGestion()">⚙️ Gérer les centres<span id="feedback-badge" class="feedback-badge" style="display:none;"></span></button>

<!-- Portail principal -->
<div class="portal" id="portal">

<script>
// ══════════════════════════════════════════════════════════
//  IGNIS.html — Portail pur
//  Lit les CIS depuis /api/cis, redirige vers /cis/{id}

// Port du serveur IGNIS (modifier si différent dans settings.json)
const SERVER_PORT = 5010;
const SERVER = (location.protocol === 'http:' || location.protocol === 'https:')
  ? location.origin
  : 'http://127.0.0.1:' + SERVER_PORT;

// ── Icône œil personnalisée pour les champs mot de passe ─────────────────
// (remplace l'icône native du navigateur, trop peu visible sur fond sombre ;
// utilise currentColor pour suivre la couleur CSS du bouton — voir .password-toggle)
const EYE_OPEN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
const EYE_CLOSED_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = EYE_CLOSED_SVG;
  } else {
    input.type = 'password';
    btn.innerHTML = EYE_OPEN_SVG;
  }
}

// ── Logo IGNIS Nova embarqué directement dans le src de l'img ──

// ── État carrousel ───────────────────────────────────────
let _centres = [];
let _idx = 0;

// ── Polling serveur ──────────────────────────────────────
let _serverOk = false;
let _lastError = '';

// Helper : fetch avec timeout compatible tous navigateurs
function fetchTimeout(url, opts = {}, ms = 4000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal })
    .finally(() => clearTimeout(t));
}

async function chargerCentres() {
  try {
    console.log('[IGNIS] Tentative de connexion à', SERVER + '/api/cis');
    const r = await fetchTimeout(SERVER + '/api/cis');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    _serverOk = true;
    _lastError = '';
    document.getElementById('offline-banner').classList.remove('show');
    const liste = (data.cis || []).filter(c => c.actif !== false);
    if (JSON.stringify(liste) !== JSON.stringify(_centres)) {
      _centres = liste;
      rendreCarousel();
      console.log('[IGNIS] ✅ Serveur OK —', liste.length, 'centre(s) chargé(s)');
    }
  } catch (err) {
    _lastError = err && err.message ? err.message : String(err);
    console.warn('[IGNIS] ❌ Échec connexion :', _lastError, '— URL:', SERVER + '/api/cis');
    const det = document.getElementById('offline-detail');
    if (det) det.textContent = `(${SERVER} · ${_lastError})`;
    if (_serverOk || _centres.length === 0) {
      _serverOk = false;
      document.getElementById('offline-banner').classList.add('show');
      afficherCarouselOffline();
    }
  }
}

// Fonction de diagnostic — accessible via bouton 🩺 ou console
window.diagnostic = async function() {
  const lignes = [];
  lignes.push('🩺 DIAGNOSTIC IGNIS');
  lignes.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  lignes.push('📍 Page actuelle : ' + location.href);
  lignes.push('🎯 URL serveur testée : ' + SERVER);
  lignes.push('🔧 Port configuré : ' + SERVER_PORT);
  lignes.push('⚠️  Dernière erreur : ' + (_lastError || '—'));
  lignes.push('');
  lignes.push('Tests en cours...');

  // Test 1 : /api/status
  let test1 = '⏳ /api/status ...';
  try {
    const r = await fetchTimeout(SERVER + '/api/status', {}, 3000);
    test1 = `✅ /api/status → HTTP ${r.status}`;
  } catch (e) {
    test1 = `❌ /api/status → ${e.message || e}`;
  }
  // Test 2 : /api/cis
  let test2 = '⏳ /api/cis ...';
  try {
    const r = await fetchTimeout(SERVER + '/api/cis', {}, 3000);
    const txt = await r.text();
    test2 = `✅ /api/cis → HTTP ${r.status} (${txt.length} octets reçus)`;
  } catch (e) {
    test2 = `❌ /api/cis → ${e.message || e}`;
  }

  lignes.push(test1);
  lignes.push(test2);
  lignes.push('');
  lignes.push('💡 Pistes :');
  lignes.push('  • Le serveur est-il lancé ? (lancer_multi_cis.bat)');
  lignes.push('  • La fenêtre console Python affiche-t-elle le port ?');
  lignes.push('  • Teste dans ton navigateur : ' + SERVER + '/api/cis');
  lignes.push('  • Pare-feu Windows bloque-t-il Python ?');

  alert(lignes.join('\n'));
  console.log(lignes.join('\n'));
};

const TYPE_META = {
  cis_volontaire:  { label: 'CIS Volontaire', badge: 'badge-volontaire', icon: '🚒' },
  cis_mixte:       { label: 'CIS Mixte',       badge: 'badge-mixte',      icon: '🚑' },
  cis_mixte_24h:   { label: 'CIS Mixte 24h',   badge: 'badge-mixte24h',   icon: '🏠' },
};

function rendreCarousel() {
  const inner = document.getElementById('carousel-inner');
  const dotsEl = document.getElementById('dots-wrap');

  if (_centres.length === 0) {
    inner.innerHTML = '<div class="loading-card"><span>ℹ️</span> Aucun centre configuré — cliquez sur ⚙️ Gérer les centres</div>';
    dotsEl.innerHTML = '';
    return;
  }

  // Clamp index
  _idx = Math.max(0, Math.min(_idx, _centres.length - 1));
  const c = _centres[_idx];
  const meta = TYPE_META[c.type_cis] || { label: c.type_cis, badge: '', icon: '🚒' };

  inner.innerHTML = `
    <div class="centre-card" onclick="ouvrirCentre('${c.id}')">
      <div class="centre-icon">${meta.icon}</div>
      <div class="centre-info">
        <div class="centre-nom">${escHtml(c.nom)}</div>
        <div class="centre-dept">${escHtml(c.departement || c.ville || '')}</div>
        <span class="centre-type-badge ${meta.badge}">${meta.label}</span>
      </div>
      <div class="centre-arrow">›</div>
    </div>`;

  // Dots
  dotsEl.innerHTML = '';
  _centres.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === _idx ? ' active' : '');
    d.onclick = () => { _idx = i; rendreCarousel(); };
    dotsEl.appendChild(d);
  });
}

function navCarousel(dir) {
  if (_centres.length === 0) return;
  _idx = (_idx + dir + _centres.length) % _centres.length;
  rendreCarousel();
}

async function validerCodeCentre() {
  const code = document.getElementById('input-centrecode')?.value.trim();
  // Pas de blocage sur un champ vide ici : on laisse le serveur trancher.
  // Un centre sans code configuré accepte une soumission vide ; un centre
  // protégé la refusera normalement (voir /api/cis/<id>/verify_admin).
  if (!_centreEnAttente) return;
  const errEl = document.getElementById('centrecode-error');
  errEl.textContent = '';

  try {
    // Vérification côté serveur — le code attendu n'est jamais transmis au
    // client (même principe que validerSuperCode() / /api/verify_super_admin).
    const r = await fetchTimeout(SERVER + '/api/cis/' + _centreEnAttente + '/verify_admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_code: code })
    });
    if (r.ok) {
      window.location.href = SERVER + '/cis/' + _centreEnAttente;
    } else {
      errEl.textContent = 'Code incorrect — réessayez.';
      document.getElementById('input-centrecode').value = '';
      document.getElementById('input-centrecode').focus();
    }
  } catch (err) {
    errEl.textContent = 'Serveur inaccessible.';
  }
}

// ── Utilitaire HTML ──────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, isErr = false, duration = 3000) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' error' : '');
  el.innerHTML = (isErr ? '⚠️ ' : '✅ ') + escHtml(msg);
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, duration);
}

async function validerSuperCode() {
  const code = document.getElementById('input-supercode')?.value.trim();
  if (!code) return;
  const errEl = document.getElementById('code-error');
  errEl.textContent = '';

  try {
    // Vérification via une route dédiée qui ne renvoie jamais le vrai code
    // (contrairement à une comparaison côté client contre une valeur lue
    // depuis une réponse serveur, qui reviendrait à divulguer le secret).
    const r = await fetchTimeout(SERVER + '/api/verify_super_admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ super_admin_code: code })
    });

    if (r.ok) {
      _superCode = code;
      _superVerified = true;
      fermerModales();
      ouvrirPanneauGestion();
    } else {
      errEl.textContent = 'Code incorrect — réessayez.';
      document.getElementById('input-supercode').value = '';
      document.getElementById('input-supercode').focus();
    }
  } catch (err) {
    errEl.textContent = 'Serveur inaccessible (' + (err.message || err) + ').';

async function chargerEmailAdmin() {
  try {
    const r = await fetchTimeout(SERVER + '/api/cis');
    if (!r.ok) return;
    const data = await r.json();
    const email = (data.settings || {}).admin_email || '';
    const input = document.getElementById('admin-email');
    if (input) input.value = email;
  } catch (e) {
    console.warn('Impossible de charger admin_email:', e);
  }
}

async function enregistrerEmailAdmin() {
  const input = document.getElementById('admin-email');
  const statusEl = document.getElementById('email-save-status');
  const btn = document.getElementById('btn-save-email');
  if (!input || !statusEl || !btn) return;

  const email = input.value.trim();
  statusEl.style.color = '#22c55e';
  statusEl.textContent = '';

  // Validation basique
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    statusEl.style.color = '#ef4444';
    statusEl.textContent = 'Format d\'email invalide.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Enregistrement…';

  try {
    const r = await fetchTimeout(SERVER + '/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ super_admin_code: _superCode, admin_email: email })
    });
    const data = await r.json();
    if (r.ok) {
      statusEl.style.color = '#22c55e';
      statusEl.textContent = '✅ Enregistré !';
      setTimeout(() => { statusEl.textContent = ''; }, 2500);
    } else {
      statusEl.style.color = '#ef4444';
      statusEl.textContent = data.error || 'Erreur lors de l\'enregistrement.';
    }
  } catch (e) {
    statusEl.style.color = '#ef4444';
    statusEl.textContent = 'Serveur inaccessible.';
  }
  btn.disabled = false;
  btn.textContent = '💾 Enregistrer l\'e-mail';
}

async function chargerListeCIS() {
  const container = document.getElementById('liste-cis-gestion');
  if (!container) return;
  try {
    const r = await fetch(SERVER + '/api/cis');
    const data = await r.json();
    const liste = data.cis || [];
    if (liste.length === 0) {
      container.innerHTML = '<div style="color:#475569;font-size:13px;padding:12px;">Aucun centre créé.</div>';
      return;
    }
    container.innerHTML = liste.map(c => {
      const meta = TYPE_META[c.type_cis] || { label: c.type_cis, badge: '', icon: '🚒' };
      const inactif = c.actif === false;
      const statut = inactif
        ? '<span style="color:#ef4444;font-size:11px;">⛔ inactif</span>'
        : '<span style="color:#22c55e;font-size:11px;">✅ actif</span>';
      const actions = inactif
        ? `<button class="btn-secondary" style="padding:8px 12px;font-size:12px;" onclick="reactiverCIS('${c.id}','${escHtml(c.nom).replace(/'/g,"\\'")}')">♻️ Réactiver</button>`
        : `<button class="btn-danger" onclick="supprimerCIS('${c.id}','${escHtml(c.nom).replace(/'/g,"\\'")}')">🗑</button>`;
      return `<div class="cis-item" id="cisitem-${c.id}">
        <div style="font-size:22px;flex-shrink:0;">${meta.icon}</div>
        <div class="cis-item-info">
          <div class="cis-item-nom">${escHtml(c.nom)}</div>

        <div class="cis-item-actions">

  } catch {
    if (container) container.innerHTML = '<div style="color:#ef4444;font-size:13px;padding:12px;">Impossible de charger la liste.</div>';
  }

function formatDateFeedback(iso) {

    return new Date(iso).toLocaleString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch { return iso || ''; }
}

async function supprimerFeedback(cisId, date) {
  if (!confirm('Supprimer ce feedback ?')) return;
  try {
    const r = await fetch(SERVER + '/api/feedback_delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ super_admin_code: _superCode, cis_id: cisId, date: date })
    });
    if (r.ok) {

      chargerFeedbackTous();
    } else {
      const d = await r.json();
      toast(d.error || 'Erreur suppression.', true);
    }
  } catch {
    toast('Serveur inaccessible.', true);
  }
}

async function creerCentre() {
  const nom = document.getElementById('new-nom')?.value.trim();
  const dept = document.getElementById('new-dept')?.value.trim() || 'Mayenne (53)';
  const adminCode = document.getElementById('new-admin-code')?.value.trim().toUpperCase();
  const typeCard = document.querySelector('.type-card.selected');
  const typeCis = typeCard ? typeCard.dataset.type : 'cis_volontaire';

  const errEl = document.getElementById('create-error');
  errEl.textContent = '';

  if (!nom) { errEl.textContent = 'Le nom du centre est requis.'; return; }
  // Le code admin est désormais facultatif : laissé vide, le centre
  // s'ouvre sans demande de code (voir ouvrirCentre / validerCodeCentre).

  const btn = document.getElementById('btn-creer');
  btn.disabled = true;
  btn.textContent = '⏳ Création…';

  try {
    const r = await fetch(SERVER + '/api/cis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        super_admin_code: _superCode,
        nom,
        departement: dept,
        type_cis: typeCis,
        admin_code: adminCode,
        ville: dept
      })
    });
    const data = await r.json();
    if (!r.ok) {
      errEl.textContent = data.error || 'Erreur lors de la création.';
      btn.disabled = false;
      btn.textContent = '🔥 Créer le centre';
      return;
    }
    toast('Centre "' + nom + '" créé avec succès !');
    document.getElementById('new-nom').value = '';
    document.getElementById('new-admin-code').value = '';
    btn.disabled = false;
    btn.textContent = '🔥 Créer le centre';
    await chargerCentres();
    chargerListeCIS();
  } catch {
    errEl.textContent = 'Serveur inaccessible.';
    btn.disabled = false;
    btn.textContent = '🔥 Créer le centre';
  }
}

async function supprimerCIS(id, nom) {
  if (!confirm(`Désactiver le centre "${nom}" ?\n\nLes données seront conservées mais le centre ne sera plus visible.`)) return;
  try {
    const r = await fetch(SERVER + '/api/cis/' + id, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ super_admin_code: _superCode })
    });
    if (r.ok) {
      toast('Centre désactivé.');
      await chargerCentres();
      chargerListeCIS();
    } else {
      const d = await r.json();
      toast(d.error || 'Erreur suppression.', true);
    }
  } catch {
    toast('Serveur inaccessible.', true);
  }
}

async function reactiverCIS(id, nom) {
  try {
    const r = await fetch(SERVER + '/api/cis/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ super_admin_code: _superCode, actif: true })
    });
    if (r.ok) {
      toast('Centre "' + nom + '" réactivé.');
      await chargerCentres();
      chargerListeCIS();
    } else {
      const d = await r.json();
      toast(d.error || 'Erreur réactivation.', true);
    }
  } catch {
    toast('Serveur inaccessible.', true);
  }
}

function fermerModales() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

// ── Badge "X nouveaux feedbacks" sur l'écran d'accueil ───────────────────
// Volontairement sans code super-admin : ne récupère qu'un nombre (voir
// /api/feedback_count côté serveur), jamais le contenu des feedbacks.
async function chargerBadgeFeedback() {
  const badge = document.getElementById('feedback-badge');
  if (!badge) return;
  try {
    const r = await fetch(SERVER + '/api/feedback_count', { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    if (data.count > 0) {
      badge.textContent = data.count > 99 ? '99+' : String(data.count);
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  } catch {
    // Pas grave si ça échoue : le badge reste simplement masqué
  }
}

// ── Chargement initial + polling ─────────────────────────
chargerCentres();
chargerBadgeFeedback();
setInterval(chargerBadgeFeedback, 60000); // revérifie toutes les minutes

// Afficher loading pendant le premier chargement
document.getElementById('carousel-inner').innerHTML =
  '<div class="loading-card"><div class="spinner"></div> Connexion au serveur…</div>';

// Polling toutes les 5 secondes
setInterval(chargerCentres, 5000);
</script>
</body>
